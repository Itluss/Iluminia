<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Eluminia — Spike 3D « Un seul monde » (prairie + pont)</title>
<style>
  :root {
    --el-cream: #F6E7C6; --el-tan: #EAD4A6; --el-brown: #684A2F; --el-brown-dark: #4a3320;
    --el-green: #77B36A; --el-green-dark: #5CAD5A; --el-orange: #FF9A4A;
    --el-purple: #8A77E6; --el-pink: #FFACC2; --el-blue: #6CC9EB; --el-white: #FFFFFF;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  #hud { position: fixed; top: 10px; left: 10px; background: rgba(46,34,24,0.86); color: #fff3d8;
         border: 2px solid rgba(234,212,166,0.4);
         padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 360px; }
  #fps { position: fixed; top: 10px; right: 10px; background: rgba(46,34,24,0.86); color: var(--el-green);
         border: 2px solid rgba(234,212,166,0.4);
         padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: bold; }
  #interact-hint { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(6px);
         background: rgba(46,34,24,0.88); color: #fff3d8; padding: 6px 14px; border-radius: 20px;
         font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #interact-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #dialogue-box { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
         width: min(560px, 86vw); background: linear-gradient(var(--el-cream), var(--el-tan));
         border: 3px solid var(--el-brown);
         border-radius: 16px; padding: 14px 20px; color: var(--el-brown-dark); opacity: 0; pointer-events: none;
         transition: opacity .2s, transform .2s; box-shadow: 0 10px 24px rgba(0,0,0,0.3); cursor: pointer; }
  #dialogue-box.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #dialogue-box .name { font-weight: 800; color: var(--el-purple); margin-bottom: 4px; font-size: 14px; }
  #dialogue-box .text { font-size: 14px; line-height: 1.5; }
  #dialogue-box .continue { text-align: right; font-size: 11px; opacity: .7; margin-top: 6px; font-style: italic; }
  #target { position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-14px);
         background: linear-gradient(var(--el-cream), var(--el-tan)); border: 3px solid var(--el-brown);
         border-radius: 14px;
         padding: 10px 22px; color: var(--el-brown-dark); font-size: 16px; font-weight: 700; text-align: center;
         box-shadow: 0 8px 18px rgba(0,0,0,0.25); opacity: 0; transition: opacity .3s, transform .3s; }
  #target.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #target b { color: var(--el-green-dark); font-size: 20px; }
  #streak { position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
         background: rgba(46,34,24,0.8); padding: 3px 12px; border-radius: 10px;
         color: #fff3d8; font-size: 12px; opacity: 0; transition: opacity .3s; }
  #streak.show { opacity: 0.9; }
  #end { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         background: rgba(20,26,20,0.45); }
  #end .card { background: linear-gradient(var(--el-cream), var(--el-tan)); border: 3px solid var(--el-brown);
         border-radius: 18px;
         padding: 24px 32px; color: var(--el-brown-dark); text-align: center; font-size: 18px; box-shadow: 0 14px 30px rgba(0,0,0,0.35); }
  #end .card small { display: block; margin-top: 8px; opacity: 0.75; font-size: 12px; }
  #portal-fade { position: fixed; inset: 0; background: #eaf6ff; opacity: 0; pointer-events: none;
         transition: opacity 0.6s ease; z-index: 50; }
  #portal-fade.show { opacity: 1; }
  /* ciel en fond DOM (derrière le canvas transparent) : dégradé recalculé
     en JS selon spaceT. Un fond CSS plein écran, indépendant de la position
     3D de la caméra, ne peut jamais laisser de trou ni se retrouver "avalé"
     par une sphère de ciel trop proche (cause des bugs précédents). */
  #sky-bg { position: fixed; inset: 0; z-index: -1; background: linear-gradient(to top, #ffe0ac 0%, #8fd0ff 100%); }

  /* ---- quête (haut-gauche, sous le bandeau d'aide) ---- */
  #quest-box { position: fixed; left: 10px; width: 250px;
         background: linear-gradient(var(--el-cream), var(--el-tan)); border: 3px solid var(--el-brown);
         border-radius: 14px;
         padding: 10px 14px; color: var(--el-brown-dark); box-shadow: 0 8px 18px rgba(0,0,0,0.22); transition: box-shadow .3s; }
  #quest-box .q-title { font-weight: 800; color: var(--el-green-dark); font-size: 13px; margin-bottom: 3px; }
  #quest-box .q-objective { font-size: 13px; line-height: 1.4; }
  #quest-box .q-progress { font-size: 12px; color: var(--el-orange); font-weight: 700; margin-top: 4px; }
  #quest-box.pulse { animation: quest-pulse 0.6s ease; }
  @keyframes quest-pulse { 0%, 100% { box-shadow: 0 8px 18px rgba(0,0,0,0.22); } 50% { box-shadow: 0 0 0 4px rgba(119,179,106,0.55), 0 8px 18px rgba(0,0,0,0.22); } }

  /* ---- niveau + XP (bas-gauche, pilule compacte — position de la planche) ---- */
  #xp-panel { position: fixed; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 10px;
         background: linear-gradient(var(--el-cream), var(--el-tan)); border: 3px solid var(--el-brown); color: var(--el-brown-dark);
         border-radius: 30px; padding: 6px 16px 6px 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.22); }
  #xp-panel .level { display: inline-flex; align-items: center; font-weight: 800; color: var(--el-white);
         background: var(--el-purple); border-radius: 12px; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
  #xp-track { width: 150px; background: rgba(104,74,47,0.25); border-radius: 8px; height: 14px; overflow: hidden; position: relative; }
  #xp-fill { background: linear-gradient(var(--el-green), var(--el-green-dark)); height: 100%; width: 0%; transition: width .25s ease; }
  #xp-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

  /* ---- ressources (haut-droite, pile de pilules sous le FPS — position de la planche) ---- */
  #resources-panel { position: fixed; top: 56px; right: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  #resources-panel .res { display: flex; align-items: center; justify-content: flex-end; gap: 5px; min-width: 58px;
         font-size: 13px; font-weight: 700; color: var(--el-brown-dark);
         background: linear-gradient(var(--el-cream), var(--el-tan)); border: 2px solid var(--el-brown);
         border-radius: 12px; padding: 4px 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.18); }

  /* ---- barre d'action (bas-centre, slots numérotés — position de la planche) ---- */
  /* boutons volontairement compacts : un slot + le cadre de la barre ne doit
     pas dépasser 6% de la hauteur d'écran (règle visual-quality.md, calibrage
     GW2) -> 38px de bouton + 6px de padding + 2px de bordure = 54px ≈ 6% de 900px. */
  #action-bar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
         display: flex; gap: 6px; background: linear-gradient(var(--el-tan), var(--el-cream)); border: 2px solid var(--el-brown);
         border-radius: 12px; padding: 6px; box-shadow: 0 8px 18px rgba(0,0,0,0.25); transition: opacity .2s, transform .2s; }
  #action-bar.hide { opacity: 0; transform: translateX(-50%) translateY(16px); pointer-events: none; }
  #action-bar button { position: relative; width: 38px; height: 38px; border-radius: 8px; border: 1.5px solid var(--el-brown);
         background: var(--el-cream); cursor: pointer;
         display: flex; align-items: center; justify-content: center; }
  #action-bar button:hover { background: var(--el-white); border-color: var(--el-green-dark);
         box-shadow: 0 0 0 3px rgba(92,173,90,0.5); }
  #action-bar button .glyph { font-size: 18px; }
  #action-bar button .num { position: absolute; top: 1px; left: 2px; font-size: 8px; font-weight: 800; color: var(--el-brown-dark);
         background: rgba(255,255,255,0.75); border-radius: 4px; padding: 0 3px; line-height: 1.3; }


  #pause-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         background: rgba(20,26,20,0.55); z-index: 40; cursor: pointer; }
  #pause-overlay .card { background: linear-gradient(var(--el-cream), var(--el-tan)); border: 3px solid var(--el-brown);
         border-radius: 18px;
         padding: 20px 30px; color: var(--el-brown-dark); text-align: center; font-size: 16px; box-shadow: 0 14px 30px rgba(0,0,0,0.3); }
  #pause-overlay.show { display: flex; }
</style>
</head>
<body>
<div id="sky-bg"></div>
<div id="hud">Chargement…</div>
<div id="quest-box">
  <div class="q-title">Quête</div>
  <div class="q-objective"></div>
  <div class="q-progress"></div>
</div>
<div id="fps">— FPS</div>
<div id="xp-panel">
  <div class="level" id="level-badge">Niv. 1</div>
  <div id="xp-track"><div id="xp-fill"></div><div id="xp-label">0 / 40</div></div>
</div>
<div id="resources-panel">
  <div class="res">
    <svg width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#ffd700" stroke="#a8730f" stroke-width="1.5"/></svg>
    <span id="coin-count">0</span>
  </div>
  <div class="res">
    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 1.2 L9.8 5.8 L14.8 6 L10.9 9.1 L12.2 14 L8 11.2 L3.8 14 L5.1 9.1 L1.2 6 L6.2 5.8 Z" fill="#8A77E6" stroke="#5c4aa8" stroke-width="1"/></svg>
    <span id="star-count">0</span>
  </div>
</div>
<div id="interact-hint">Appuie sur E pour parler</div>
<div id="dialogue-box">
  <div class="name"></div>
  <div class="text"></div>
  <div class="continue">clique ou Espace pour continuer</div>
</div>
<div id="target">Saute sur : <b>—</b></div>
<div id="streak"></div>
<div id="end"><div class="card">🌉 Bravo, pont traversé !<small>Recharge la page pour rejouer</small></div></div>
<div id="portal-fade" class="show"></div>
<div id="pause-overlay"><div class="card">⏸ Jeu en pause<br><small>Clique pour reprendre</small></div></div>
<div id="action-bar">
  <button id="btn-quest" type="button" title="Objectif"><span class="num">1</span><span class="glyph">🎯</span></button>
  <button id="btn-camera" type="button" title="Caméra"><span class="num">2</span><span class="glyph">📷</span></button>
  <button id="btn-pause" type="button" title="Pause"><span class="num">3</span><span class="glyph">⏸</span></button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
// ============================================================
// SPIKE 3D « Un seul monde » — fusion de spike3d-warm.html
// (prairie + PNJ Elda) et spike3d-bridge.html (défi des
// fractions) dans UNE scène continue : la prairie mène à l'est
// vers le pont, un seul héros, une seule caméra qui suit.
// ============================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.addEventListener('error', e => {
  document.getElementById('hud').innerHTML = `<b>Erreur :</b> ${e.message}`;
});

const hud = document.getElementById('hud');
const fpsEl = document.getElementById('fps');

// -------- progression, ressources, quête (HUD) --------
const questObjectiveEl = document.querySelector('#quest-box .q-objective');
const questProgressEl = document.querySelector('#quest-box .q-progress');
const questBoxEl = document.getElementById('quest-box');
const levelBadgeEl = document.getElementById('level-badge');
const xpFillEl = document.getElementById('xp-fill');
const xpLabelEl = document.getElementById('xp-label');
const coinCountEl = document.getElementById('coin-count');
const starCountEl = document.getElementById('star-count');
const actionBarEl = document.getElementById('action-bar');
const pauseOverlayEl = document.getElementById('pause-overlay');

const progress = { level: 1, xp: 0, xpNext: 40, coins: 0, stars: 0 };
let stage = 'meet-elda'; // meet-elda -> lesson -> bridge -> done
let paused = false;

function updateProgressPanel() {
  levelBadgeEl.textContent = `Niv. ${progress.level}`;
  xpFillEl.style.width = `${Math.min(100, (progress.xp / progress.xpNext) * 100)}%`;
  xpLabelEl.textContent = `${progress.xp} / ${progress.xpNext}`;
  coinCountEl.textContent = progress.coins;
  starCountEl.textContent = progress.stars;
}
function addReward(xpGain, coinGain) {
  progress.xp += xpGain; progress.coins += coinGain;
  while (progress.xp >= progress.xpNext) {
    progress.xp -= progress.xpNext;
    progress.level += 1;
    progress.xpNext = Math.round(progress.xpNext * 1.25);
  }
  updateProgressPanel();
}
function updateQuestBox() {
  let text, prog = '';
  if (stage === 'meet-elda') text = 'Parle à Elda, près de l’Arbre Doré (E)';
  else if (stage === 'lesson') text = 'Approche-toi de la galette pour la leçon des fractions';
  else if (stage === 'bridge') { text = 'Traverse le pont : saute sur la bonne fraction'; prog = `${solvedCount}/${planks.length}`; }
  else { text = 'Pont traversé — bravo !'; prog = `${solvedCount}/${planks.length}`; }
  questObjectiveEl.textContent = text;
  questProgressEl.textContent = prog;
}
updateProgressPanel();

function positionQuestBox() {
  questBoxEl.style.top = `${hud.getBoundingClientRect().bottom + 8}px`;
}
positionQuestBox();
addEventListener('resize', positionQuestBox);

document.getElementById('btn-quest').addEventListener('click', () => {
  questBoxEl.classList.remove('pulse');
  void questBoxEl.offsetWidth; // relance l'animation même si déjà jouée
  questBoxEl.classList.add('pulse');
});
document.getElementById('btn-camera').addEventListener('click', () => { targetZoom = GAMEPLAY_ZOOM; });
document.getElementById('btn-pause').addEventListener('click', () => setPaused(true));
pauseOverlayEl.addEventListener('click', () => setPaused(false));
function setPaused(v) {
  paused = v;
  pauseOverlayEl.classList.toggle('show', v);
  if (!v) clock.getDelta(); // absorbe le temps écoulé pendant la pause
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0); // le fond vient de #sky-bg (DOM), le canvas reste transparent
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const skyBgEl = document.getElementById('sky-bg');

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffe3b0, 70, 170);

const frustum = 13;
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-frustum * aspect / 2, frustum * aspect / 2, frustum / 2, -frustum / 2, 0.1, 1200);
camera.position.set(26, 24, 26);
camera.lookAt(0, 2, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enableZoom = false; // zoom géré à la main plus bas (rythme garanti, indépendant du device)
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.target.set(0, 2, 0);
controls.minZoom = 0.018; controls.maxZoom = 2.2;

// -------- zoom lissé « à la main » --------
// OrbitControls applique le delta de la molette/trackpad directement à camera.zoom :
// un seul geste physique peut envoyer un deltaY énorme (surtout au trackpad) et faire
// sauter le zoom instantanément, quelle que soit la formule de rythme appliquée ensuite
// (une valeur qui saute reste une valeur qui saute). Ici on sépare la CIBLE (mise à jour
// immédiatement par l'utilisateur) du zoom RÉELLEMENT AFFICHÉ, qui ne peut avancer que
// d'une vitesse bornée dans le temps -> transition garantie fluide, quel que soit le device.
let targetZoom = camera.zoom;
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0012);
  targetZoom = THREE.MathUtils.clamp(targetZoom * factor, controls.minZoom, controls.maxZoom);
}, { passive: false });
controls.enablePan = false;
const GAMEPLAY_ZOOM = 0.6;

// -------- toon shading + contours peints --------
function makeToonGradient(colors) {
  const c = document.createElement('canvas');
  c.width = colors.length; c.height = 1;
  const ctx = c.getContext('2d');
  colors.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(i, 0, 1, 1); });
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}
const warmGradient = makeToonGradient(['#5b4468', '#c9825f', '#ffd39b', '#fff6de']);
const OUTLINE = 0x3d2f52;

// -------- courbure « petite planète » (déforme tout le décor au dézoom) --------
// Injectée dans chaque matériau : décale le sommet vers le bas selon le carré de sa
// distance (monde) au centre de la planète, comme la calotte visible d'une sphère.
// Un seul uniform partagé piloté depuis la boucle -> tout le décor courbe ensemble.
const PLANET_CENTER = { x: 6, z: 0 };
// rayon de la sphère implicite : énorme (quasi plat) en jeu normal, se resserre
// au dézoom. Équation de sphère bornée (pas une parabole) : ne peut jamais se
// replier sur elle-même, contrairement à un simple y -= k*d².
const planetRadiusUniform = { value: 100000 };
function applyCurvature(material) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uPlanetRadius = planetRadiusUniform;
    shader.vertexShader = `uniform float uPlanetRadius;\n${shader.vertexShader}`
      .replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        {
          vec4 curveWorldPos = modelMatrix * vec4(transformed, 1.0);
          float curveDx = curveWorldPos.x - ${PLANET_CENTER.x.toFixed(1)};
          float curveDz = curveWorldPos.z - ${PLANET_CENTER.z.toFixed(1)};
          float curveD2 = curveDx * curveDx + curveDz * curveDz;
          float curveR2 = uPlanetRadius * uPlanetRadius;
          transformed.y -= uPlanetRadius - sqrt(max(curveR2 - curveD2, 0.0001));
        }`,
      )
      // sans ce bloc, la NORMALE garde la direction du disque plat d'origine
      // (calculée avant la courbure ci-dessus, jamais réajustée) -> une
      // surface visuellement bombée mais éclairée comme si elle était plate,
      // un aplat lumineux qui saute aux yeux à côté d'une vraie sphère
      // correctement ombrée (planetShell) -> effet "plateau posé sur une
      // boule". Repart de la position BRUTE `position` (pas `transformed`,
      // pas encore courbée à ce stade du shader) pour recalculer la normale
      // radiale exacte de la sphère implicite (gradient de x²+z²+(y+Rp)²=Rp²).
      .replace(
        '#include <defaultnormal_vertex>',
        `#include <defaultnormal_vertex>
        {
          vec4 nWorldPos = modelMatrix * vec4(position, 1.0);
          float nDx = nWorldPos.x - ${PLANET_CENTER.x.toFixed(1)};
          float nDz = nWorldPos.z - ${PLANET_CENTER.z.toFixed(1)};
          float nD2 = nDx * nDx + nDz * nDz;
          float nR2 = uPlanetRadius * uPlanetRadius;
          float nCurvedY = nWorldPos.y - (uPlanetRadius - sqrt(max(nR2 - nD2, 0.0001)));
          vec3 nSphereCenter = vec3(${PLANET_CENTER.x.toFixed(1)}, nWorldPos.y - uPlanetRadius, ${PLANET_CENTER.z.toFixed(1)});
          vec3 nWorldNormal = normalize(vec3(nWorldPos.x, nCurvedY, nWorldPos.z) - nSphereCenter);
          transformedNormal = normalize(mat3(viewMatrix) * nWorldNormal);
        }`,
      );
  };
  material.needsUpdate = true;
  return material;
}
function addOutline(mesh, scale = 1.06) {
  const outline = new THREE.Mesh(mesh.geometry, applyCurvature(new THREE.MeshBasicMaterial({ color: OUTLINE, side: THREE.BackSide })));
  outline.scale.setScalar(scale);
  mesh.add(outline);
  return outline;
}
function addGlowOutline(mesh, scale = 1.12, color = 0xfff3c4) {
  const glow = new THREE.Mesh(mesh.geometry, applyCurvature(new THREE.MeshBasicMaterial({
    color, side: THREE.BackSide, transparent: true, opacity: 0.9, depthWrite: false, toneMapped: false,
  })));
  glow.scale.setScalar(scale);
  glow.visible = false;
  mesh.add(glow);
  return glow;
}
function toon(geo, color, opts = {}) {
  const mat = applyCurvature(new THREE.MeshToonMaterial({ color, gradientMap: warmGradient, flatShading: opts.flat ?? true }));
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  if (opts.outline !== false) addOutline(mesh, opts.outlineScale ?? 1.06);
  return mesh;
}
// même rendu toon + contour peint, mais SANS la déformation de courbure — pour
// les icônes de planète (déjà sphériques : la courbure de calotte les abîmerait).
function toonPlain(geo, color, opts = {}) {
  const mat = new THREE.MeshToonMaterial({ color, gradientMap: warmGradient, flatShading: opts.flat ?? false, fog: opts.fog ?? true });
  const mesh = new THREE.Mesh(geo, mat);
  let outline = null;
  if (opts.outline !== false) {
    outline = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: OUTLINE, side: THREE.BackSide, fog: opts.fog ?? true }));
    outline.scale.setScalar(opts.outlineScale ?? 1.05);
    mesh.add(outline);
  }
  return { mesh, outline };
}
function emissive(geo, color, intensity = 1.4) {
  const mat = applyCurvature(new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, toneMapped: false }));
  return new THREE.Mesh(geo, mat);
}
function makeGlowSprite() {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowSprite();

// -------- zone du pont (exclue de la dispersion de décor prairie) --------
const BRIDGE_MIN_X = 9;

// Anneaux concentriques (pas un simple éventail) : la courbure « petite planète »
// a besoin de résolution radiale pour se voir lisse et non facettée au dézoom.
function makeDiscGeometry(radius, rings, segments) {
  const positions = [];
  const indices = [];
  for (let r = 0; r <= rings; r++) {
    // anneaux plus serrés vers le bord (exposant < 1) : c'est là que la
    // courbure devient extrême au dézoom profond (rayon de courbure ~ rayon
    // du disque) -> un espacement linéaire y facette visiblement (rendu en
    // gros polygones plats sur une pente proche de la verticale).
    const rad = radius * Math.pow(r / rings, 0.45);
    for (let s = 0; s <= segments; s++) {
      const a = (s / segments) * Math.PI * 2;
      positions.push(Math.cos(a) * rad, 0, Math.sin(a) * rad);
    }
  }
  const stride = segments + 1;
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < segments; s++) {
      const a0 = r * stride + s, a1 = a0 + 1;
      const b0 = (r + 1) * stride + s, b1 = b0 + 1;
      indices.push(a0, a1, b0, a1, b1, b0);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// -------- coque de la planète --------
// referme le sol en boule complète, à TOUT moment et sous N'IMPORTE QUEL
// angle (zoom OU rotation caméra manuelle) -- pas de bascule caméra forcée,
// pas d'objet séparé qui "apparaît" à un instant donné : cette sphère est
// mathématiquement LA MÊME surface que la courbure du sol (même équation,
// même centre, même rayon Rp mis à jour chaque frame -> `y = -Rp + sqrt(Rp²-d²)`
// EST l'équation d'une sphère de rayon Rp centrée en (cx,-Rp,cz), exactement
// ce que fait déjà `applyCurvature()`), donc toujours parfaitement continue
// avec lui, du gameplay normal (rayon énorme, quasi plat) jusqu'à l'espace
// (rayon resserré). Géométrie unité + `scale`/`position` recalculés chaque
// frame -> pas de génération de géométrie à un rayon énorme (précision flottante).
// pas de contour peint ici : un contour "coque gonflée" (technique inverted
// hull) devient disproportionnellement épais vu à angle rasant (exactement
// ce qui arrive près de l'horizon de la calotte) -> bande sombre inattendue.
// même couleur que le sol (pas la teinte plus sombre de son liseré
// `groundEdge`) -> sinon on voit littéralement un plateau clair posé sur une
// boule plus sombre au lieu d'UNE seule surface continue.

function makeCloudTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const blobs = [[64, 70, 46], [40, 66, 32], [90, 66, 32], [58, 48, 30], [80, 52, 26]];
  for (const [bx, by, br] of blobs) {
    const grad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad.addColorStop(0.7, 'rgba(255,255,255,0.55)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

// Instanciées (InstancedMesh) : ~230 tirages individuels avant optimisation
// coûtaient chacun 1-2 appels de rendu (+ ombre) -> gros facteur du FPS
// en dessous de 60 une fois la prairie et le pont réunis dans la même scène.
function scatter(count, radiusMin, radiusMax, fn) {
  let placed = 0, attempts = 0;
  while (placed < count && attempts < count * 4) {
    attempts++;
    const a = Math.random() * Math.PI * 2;
    const r = radiusMin + Math.random() * (radiusMax - radiusMin);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (inBridgeCorridor(x, z)) continue;
    fn(x, z, placed); placed++;
  }
}

function makeFenceRun(x1, z1, x2, z2, postSpacing = 0.9) {
  const g = new THREE.Group();
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const count = Math.max(2, Math.round(len / postSpacing));
  const posts = [];
  for (let i = 0; i <= count; i++) {
    const t = i / count;
    const px = x1 + dx * t, pz = z1 + dz * t;
    const post = toon(new THREE.CylinderGeometry(0.05, 0.06, 0.6, 6), 0x8a5a3a, { outlineScale: 1.1 });
    post.position.set(px, 0.3, pz);
    g.add(post);
    posts.push([px, pz]);
  }
  const yaw = Math.atan2(dx, dz);
  for (let i = 0; i < posts.length - 1; i++) {
    const [ax, az] = posts[i], [bx, bz] = posts[i + 1];
    const mx = (ax + bx) / 2, mz = (az + bz) / 2;
    const segLen = Math.hypot(bx - ax, bz - az);
    for (const yOff of [0.42, 0.22]) {
      const rail = toon(new THREE.BoxGeometry(0.05, 0.05, segLen), 0x9a6b46, { outlineScale: 1.05 });
      rail.position.set(mx, yOff, mz);
      rail.rotation.y = yaw;
      g.add(rail);
    }
  }
  return { group: g, posts };
}

function makeRippleTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const tex = new THREE.CanvasTexture(canvas);
  return { canvas, ctx: canvas.getContext('2d'), tex };
}
function drawRipple(ripple, time) {
  const { canvas, ctx } = ripple;
  const size = canvas.width, cx = size / 2, cy = size / 2, maxR = size / 2;
  ctx.clearRect(0, 0, size, size);
  const base = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  base.addColorStop(0, '#e8fbff');
  base.addColorStop(0.55, '#8fe0ff');
  base.addColorStop(1, '#3fa8e8');
  ctx.fillStyle = base;
  ctx.beginPath(); ctx.arc(cx, cy, maxR, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 5; i++) {
    const r = ((time * 26 + i * (maxR * 1.3) / 5) % (maxR * 1.3));
    ctx.globalAlpha = Math.max(0, 1 - r / maxR) * 0.8;
    ctx.lineWidth = 2.5 + Math.sin(time * 3 + i) * 1.2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ripple.tex.needsUpdate = true;
}
function makePortal(ringColor, horizonColor) {

  const ring = toon(new THREE.TorusGeometry(1.5, 0.22, 12, 28), ringColor, { outlineScale: 1.04 });
  ring.position.y = 1.6; g.add(ring);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const chevron = toon(new THREE.BoxGeometry(0.26, 0.32, 0.16), 0xc9a24a, { outlineScale: 1.08 });
    chevron.position.set(Math.cos(a) * 1.62, 1.6 + Math.sin(a) * 1.62, 0.16);
    chevron.rotation.z = a;
    g.add(chevron);
  }
  const ripple = makeRippleTexture();
  const horizonMat = new THREE.MeshBasicMaterial({ map: ripple.tex, side: THREE.DoubleSide, toneMapped: false });
  const horizon = new THREE.Mesh(new THREE.CircleGeometry(1.32, 28), horizonMat);
  horizon.position.set(0, 1.6, 0);

  const portalLight = new THREE.PointLight(horizonColor, 1.3, 7, 2);
  portalLight.position.set(0, 1.6, 0.2); g.add(portalLight);
  const sparkles = [];

  }
  return { group: g, horizon, ripple, sparkles };
}

// part de galette PLEINE (avec épaisseur) : indispensable pour que l'astuce de
// contour lumineux (duplicata agrandi, face arrière) fonctionne comme sur un
// volume rond — une simple part plate ne montre son rebord que par endroits.
function makeWedgeGeometry(angleStart, angleLength, radius, thickness, segments = 8) {
  const positions = [];
  const indices = [];
  const topCenter = 0;
  positions.push(0, thickness, 0);
  const topArc = 1;
  for (let i = 0; i <= segments; i++) {
    const a = angleStart + (angleLength * i) / segments;
    positions.push(Math.cos(a) * radius, thickness, Math.sin(a) * radius);
  }
  for (let i = 0; i < segments; i++) indices.push(topCenter, topArc + i + 1, topArc + i);

  const botCenter = positions.length / 3;
  positions.push(0, 0, 0);
  const botArc = botCenter + 1;
  for (let i = 0; i <= segments; i++) {
    const a = angleStart + (angleLength * i) / segments;
    positions.push(Math.cos(a) * radius, 0, Math.sin(a) * radius);
  }
  for (let i = 0; i < segments; i++) indices.push(botCenter, botArc + i, botArc + i + 1);

  for (let i = 0; i < segments; i++) {
    const t0 = topArc + i, t1 = topArc + i + 1, b0 = botArc + i, b1 = botArc + i + 1;
    indices.push(t0, b0, t1, t1, b0, b1);
  }
  const topArcLast = topArc + segments, botArcLast = botArc + segments;
  indices.push(topCenter, botCenter, topArc);
  indices.push(topArc, botCenter, botArc);
  indices.push(topCenter, topArcLast, botCenter);
  indices.push(topArcLast, botArcLast, botCenter);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}
function makePieStand() {
  const g = new THREE.Group();
  const stump = toon(new THREE.CylinderGeometry(0.7, 0.8, 0.5, 14), 0x8a5a3a, { outlineScale: 1.05 });
  stump.position.y = 0.25; g.add(stump);
  const wedgeColors = [0xffd27a, 0xffb84a, 0xffd27a, 0xffb84a];
  const wedges = [];
  for (let i = 0; i < 4; i++) {
    const angleStart = i * (Math.PI / 2);
    const geo = makeWedgeGeometry(angleStart, Math.PI / 2, 1.05, 0.14);
    const wedge = toon(geo, wedgeColors[i], { outlineScale: 1.03, flat: false });
    const mid = angleStart + Math.PI / 4;
    wedge.userData.dirX = Math.cos(mid);
    wedge.userData.dirZ = Math.sin(mid);
    wedge.userData.baseY = 0.52;
    wedge.position.y = 0.52;
    wedge.userData.index = i;
    g.add(wedge);
    wedges.push(wedge);
  }
  return { group: g, wedges, stump };
}

  const stones = [];
  for (let s = 0; s < waypoints.length - 1; s++) {
    const a = waypoints[s], b = waypoints[s + 1];
    for (let i = 0; i < countPerSegment; i++) {

        THREE.MathUtils.lerp(a[1], b[1], t) + (Math.random() - 0.5) * 0.5,
      ]);
    }
  }
  return stones;
}

function burst(position, color, { count = 16, spread = 2.6, life = 0.7, size = 0.22 } = {}) {

  const mat = new THREE.PointsMaterial({ size, map: glowTex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });

          advanceDialogue();
        } else {
          burst(wedgeHit.point, 0x9fd8ff, { count: 12, life: 0.4, spread: 1.8 });
        }
      }
    }
    return;
  }
  const boards = planks.filter(p => !p.userData.solved).map(p => p.userData.board);
  const plankHit = ray.intersectObjects(boards)[0];
  if (plankHit) {
    const plankGroup = planks.find(p => p.userData.board === plankHit.object);
    if (plankGroup) { handlePlankClick(plankGroup); return; }
  }
  const hit = ray.intersectObject(ground)[0];
  if (hit) { moveTarget.copy(hit.point); moving = true; spawnClickRing(hit.point); }
});

let rotating = false;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button === 2) { rotating = true; renderer.domElement.style.cursor = 'grabbing'; }
});
addEventListener('pointerup', e => {
  if (e.button === 2) rotating = false;
});

renderer.domElement.addEventListener('pointermove', e => {
  if (rotating) { renderer.domElement.style.cursor = 'grabbing'; return; }
  ray.setFromCamera({ x: (e.clientX / innerWidth) * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
  let cursor = 'default';
  let hoverGroup = null;
  if (dialogue.open) {
    if (dialogue.awaitingWedgeClick && ray.intersectObjects(pieStand.wedges)[0]) cursor = 'pointer';
  } else if (!busy) {
    const hoverHit = ray.intersectObjects(hoverTargets())[0];
    if (hoverHit) { cursor = 'pointer'; hoverGroup = hoverHit.object.userData.haloTarget; }
  }
  renderer.domElement.style.cursor = cursor;
  setHoveredGroup(hoverGroup);
});

addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left = -frustum * aspect / 2; camera.right = frustum * aspect / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// hooks de test (banc d'essai uniquement, sans impact gameplay)
window.__spikeDebug = {
  setPlanetRadius: (v) => { planetRadiusUniform.value = v; },
  getPlanetRadius: () => planetRadiusUniform.value,
  dumpCurvatureShader: () => {
    const m = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: warmGradient });
    applyCurvature(m);
    let vs = null;
    const orig = m.onBeforeCompile;
    m.onBeforeCompile = (shader) => { orig(shader); vs = shader.vertexShader; };
    const geo = new THREE.SphereGeometry(1, 4, 4);
    const mesh = new THREE.Mesh(geo, m);
    const tmpScene = new THREE.Scene();
    tmpScene.add(mesh);
    renderer.compile(tmpScene, camera);
    return vs;
  },
  gotoElda: () => { moveTarget.copy(elda.group.position); moving = true; },
  openDialogue: () => openDialogue(ELDA_LINES),
  gotoBridge: () => { moveTarget.set(BANK_NEAR_X, 0, 0); moving = true; },
  getTarget: () => bridgeGoal?.userData.fraction,
  clickFraction: frac => { const p = planks.find(pl => pl.userData.fraction === frac); if (p) handlePlankClick(p); },
  getHeroPos: () => ({ x: hero.group.position.x, z: hero.group.position.z, moving }),
  goto: (x, z) => { moveTarget.set(x, 0, z); moving = true; },
  wedgeScreenPos: (index) => {
    const v = new THREE.Vector3();
    pieStand.wedges[index].getWorldPosition(v);
    v.project(camera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
  },
  screenPosOf: (x, y, z) => {
    const v = new THREE.Vector3(x, y, z);
    v.project(camera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
  },
  getCursor: () => renderer.domElement.style.cursor,
  getRipplePixel: () => Array.from(portal.ripple.ctx.getImageData(30, 64, 1, 1).data),
  hideThings: (which) => {
    const map = { outcrop, outcropTreeA, outcropTreeB, neighborPlanet, portal: portal.group, stars, well: undefined };
    for (const name of which) { if (map[name]) map[name].visible = false; }
  },
  getZoomState: () => ({
    zoom: camera.zoom, spaceT, fogFar: scene.fog.far,
    skyBg: skyBgEl.style.background, starOpacity: starsMat.opacity,
    camY: camera.position.y, camDist: camera.position.distanceTo(controls.target),
  }),
  getNeighborDebug: () => {
    const v = new THREE.Vector3();
    neighborPlanet.getWorldPosition(v);
    const ndc = v.clone().project(camera);
    return {
      worldPos: v.toArray(),
      ndc: ndc.toArray(),
      visible: neighborPlanet.visible,
      camPos: camera.position.toArray(),
      target: controls.target.toArray(),
      camZoom: camera.zoom,
      frustumLRTB: [camera.left, camera.right, camera.top, camera.bottom],
    };
  },
  getNdcFor: (x, y, z) => new THREE.Vector3(x, y, z).project(camera).toArray(),
  isGlowVisible: () => hoveredGroup !== null,
};

// -------- collision héros / décor --------
const heroRadius = 0.4;
function collides(x, z) {
  for (const o of obstacles) {
    const dx = x - o.x, dz = z - o.z;
    const minDist = o.r + heroRadius;
    if (dx * dx + dz * dz < minDist * minDist) return true;
  }
  return false;
}

// -------- boucle --------
let t = 0;
let frames = 0, fpsTime = performance.now();
const clock = new THREE.Clock();

function animateWalk(chibi, dt, walking) {
  const speed = walking ? 8 : 2.2;
  t += dt * speed;
  const bob = walking ? Math.abs(Math.sin(t)) * 0.09 : Math.sin(t * 0.6) * 0.02;
  chibi.group.position.y = bob;
  chibi.parts.hood.rotation.z = Math.sin(t * 0.5) * 0.05;
  const swing = walking ? Math.sin(t) * 0.55 : 0;
  chibi.parts.legL.rotation.x = swing; chibi.parts.legR.rotation.x = -swing;
  chibi.parts.armL.rotation.x = -swing * 0.8; chibi.parts.armR.rotation.x = swing * 0.8;
  if (chibi.parts.tail) chibi.parts.tail.rotation.z = Math.sin(t * 0.8) * 0.25;
}

function loop() {
  requestAnimationFrame(loop);
  if (paused) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const distToElda = hero.group.position.distanceTo(elda.group.position);
  const distToLesson = hero.group.position.distanceTo(pieStand.group.position);
  if (!dialogue.open && distToLesson < 2.6) { dialogue.canTalk = true; dialogue.talkTarget = 'lesson'; }
  else if (!dialogue.open && distToElda < 2.4) { dialogue.canTalk = true; dialogue.talkTarget = 'elda'; }
  else { dialogue.canTalk = false; dialogue.talkTarget = null; }
  hintEl.classList.toggle('show', dialogue.canTalk);
  actionBarEl.classList.toggle('hide', dialogue.open);
  markerSprite.visible = !dialogue.open;
  lessonMarkerSprite.visible = !dialogue.open;

  if (!portalTraveling && hero.group.position.distanceTo(portal.group.position) < 1.2) {
    travelThroughPortal();
  }
  drawRipple(portal.ripple, elapsed);
  portal.sparkles.forEach(sp => {
    const a = sp.userData.angle + elapsed * 0.6;
    sp.position.set(
      portal.group.position.x + Math.cos(a) * sp.userData.radius,
      1.6 + Math.sin(elapsed * 1.8 + sp.userData.phase) * 0.6,
      portal.group.position.z + Math.sin(a) * sp.userData.radius,
    );
  });

  pieSplitProgress += (pieSplitTarget - pieSplitProgress) * Math.min(1, dt * 4);
  const liftTarget = liftedWedgeIndex >= 0 ? 1 : 0;
  liftProgress += (liftTarget - liftProgress) * Math.min(1, dt * 4);
  pieStand.wedges.forEach((w, i) => {
    w.position.x = w.userData.dirX * 0.16 * pieSplitProgress;
    w.position.z = w.userData.dirZ * 0.16 * pieSplitProgress;
    w.position.y = w.userData.baseY + (i === liftedWedgeIndex ? liftProgress * 0.35 : 0);
  });

  const nearBridge = hero.group.position.x > BRIDGE_MIN_X - 2 || moveTarget.x > BRIDGE_MIN_X - 2;
  targetEl.classList.toggle('show', nearBridge && bridgeGoal);
  streakEl.classList.toggle('show', nearBridge);

  let walking = false;
  if (moving && !dialogue.open && !busy) {
    const d = moveTarget.clone().sub(hero.group.position); d.y = 0;
    const dist = d.length();
    if (dist > 0.15) {
      const dirX = d.x / dist, dirZ = d.z / dist;
      let remaining = Math.min(dist, 5 * dt);
      const subStep = 0.08;
      while (remaining > 0) {
        const s = Math.min(subStep, remaining);
        const curX = hero.group.position.x, curZ = hero.group.position.z;
        let nx = curX + dirX * s, nz = curZ + dirZ * s;
        const hit = obstacles.find(o => {
          const dx = nx - o.x, dz = nz - o.z;
          const minDist = o.r + heroRadius;
          return dx * dx + dz * dz < minDist * minDist;
        });
        if (hit) {
          // glisse le long de la tangente du cercle plutôt que de bloquer net
          const dist0 = Math.hypot(curX - hit.x, curZ - hit.z) || 0.0001;
          const nrmX = (curX - hit.x) / dist0, nrmZ = (curZ - hit.z) / dist0;
          const tangX = -nrmZ, tangZ = nrmX;
          const proj = dirX * tangX + dirZ * tangZ;
          let tx = curX + tangX * proj * s, tz = curZ + tangZ * proj * s;
          if (collides(tx, tz)) { tx = curX; tz = curZ; }
          nx = tx; nz = tz;
        }
        hero.group.position.x = nx;
        hero.group.position.z = nz;
        remaining -= s;
      }
      hero.group.rotation.y = Math.atan2(d.x, d.z);
      walking = true;
    } else { moving = false; }
  }
  if (!busy) animateWalk(hero, dt, walking);

  fox.group.position.x = hero.group.position.x + 1.2;
  fox.group.position.z = hero.group.position.z - 1.1;
  animateWalk(fox, dt, walking);
  animateWalk(elda, dt, false);

  fruits.forEach((f, i) => { f.position.y += Math.sin(performance.now() * 0.002 + i) * 0.0006; f.rotation.y += dt * 0.6; });
  treeGlow.intensity = 1.2 + Math.sin(performance.now() * 0.003) * 0.3;

  totem.userData.glow.intensity = 0.7 + Math.sin(performance.now() * 0.002) * 0.25;
  totemSparkles.forEach(sp => {
    const a = sp.userData.angle + elapsed * 0.4;
    sp.position.set(
      totem.position.x + Math.cos(a) * sp.userData.radius,
      0.7 + Math.sin(elapsed * 1.5 + sp.userData.phase) * 0.5,
      totem.position.z + Math.sin(a) * sp.userData.radius,
    );
  });

  const fp = fireflyGeo.attributes.position;
  for (let i = 0; i < fireflyCount; i++) { const ph = fireflyPhase[i] + performance.now() * 0.0006; fp.array[i * 3 + 1] += Math.sin(ph) * 0.0015; }
  fp.needsUpdate = true;
  const bp = butterflyGeo.attributes.position;
  for (let i = 0; i < butterflyCount; i++) {
    const ph = butterflyPhase[i] + elapsed * 1.3;
    bp.array[i * 3] = butterflyBaseX[i] + Math.cos(ph) * 0.9;
    bp.array[i * 3 + 1] = 0.7 + Math.abs(Math.sin(ph * 2.4)) * 0.5;
    bp.array[i * 3 + 2] = butterflyBaseZ[i] + Math.sin(ph) * 0.9;
  }
  bp.needsUpdate = true;
  for (const s of waterSparkles) s.position.y = s.userData.baseY + Math.sin(elapsed * 1.6 + s.userData.phase) * 0.05;
  for (const p of planks) if (!p.userData.solved) p.position.y = 0.2 + Math.sin(elapsed * 1.2 + p.userData.phase) * 0.04;

  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt / tw.duration;
    const prog = Math.min(tw.t, 1);
    if (tw.obj === hero.group) {
      const arc = Math.sin(prog * Math.PI) * 1.1;
      hero.group.position.x = THREE.MathUtils.lerp(tw.from.x, tw.to.x, prog);
      hero.group.position.z = THREE.MathUtils.lerp(tw.from.z, tw.to.z, prog);
      hero.group.position.y = THREE.MathUtils.lerp(tw.from.y, tw.to.y, prog) + arc;
      hero.group.scale.y = 1 + Math.sin(prog * Math.PI) * 0.25;
    } else {
      tw.obj.position.lerpVectors(tw.from, tw.to, prog);
      tw.obj.rotation.z = prog * 0.9;
    }
    if (prog >= 1) {
      if (tw.obj === hero.group) hero.group.scale.set(1, 1, 1);
      tweens.splice(i, 1);
      tw.onDone?.();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const age = elapsed - p.born;
    if (age >= p.life) { scene.remove(p.pts); p.pts.geometry.dispose(); p.pts.material.dispose(); particles.splice(i, 1); continue; }
    const arr = p.pts.geometry.attributes.position.array;
    for (let j = 0; j < p.velocities.length; j++) {
      arr[j * 3] += p.velocities[j].x * dt;
      arr[j * 3 + 1] += p.velocities[j].y * dt; p.velocities[j].y -= 3.2 * dt;
      arr[j * 3 + 2] += p.velocities[j].z * dt;
    }
    p.pts.geometry.attributes.position.needsUpdate = true;
    p.pts.material.opacity = 1 - age / p.life;
  }
  for (let i = clickRings.length - 1; i >= 0; i--) {
    const c = clickRings[i];
    const age = elapsed - c.born;
    const life = 0.5;
    if (age >= life) { scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose(); clickRings.splice(i, 1); continue; }
    const p = age / life;
    c.mesh.scale.setScalar(1 + p * 1.8);
    c.mesh.material.opacity = 0.9 * (1 - p);
  }

  controls.target.lerp(new THREE.Vector3(hero.group.position.x, 1.2, hero.group.position.z), 0.06);
  controls.update();

  // avance le zoom RÉEL vers la cible à vitesse bornée dans le temps (pas dans le nombre
  // de crans reçus) -> même un gros geste de molette/trackpad reste une transition douce
  camera.zoom += (targetZoom - camera.zoom) * Math.min(1, dt * 2.2);
  camera.updateProjectionMatrix();

  // -------- dézoom vers la vue spatiale (planète + voisines) --------
  // le zoom orbital change de façon MULTIPLICATIVE (chaque cran de molette
  // réduit camera.zoom d'un pourcentage) -> interpoler sur la valeur brute
  // concentre toute la transition sur les tout premiers crans, puis plus rien
  // ne bouge pendant très longtemps. Interpoler sur le logarithme du zoom
  // donne un rythme réellement régulier, cran après cran.
  spaceT = THREE.MathUtils.clamp(
    THREE.MathUtils.inverseLerp(Math.log(GAMEPLAY_ZOOM), Math.log(controls.minZoom * 1.4), Math.log(camera.zoom)), 0, 1,
  );
  // recule la caméra en s'éloignant du dézoom (invisible en ortho, la taille à l'écran
  // ne dépend que de camera.zoom) -> reste hors de la sphère-planète qui apparaît
  let camDist = camera.position.distanceTo(controls.target);
  if (spaceT > 0.001) {
    const camOffset = camera.position.clone().sub(controls.target);
    const curDist = camOffset.length();
    const wantDist = THREE.MathUtils.lerp(curDist, 320, spaceT);
    camOffset.multiplyScalar(wantDist / curDist);
    camera.position.copy(controls.target).add(camOffset);
    camDist = wantDist;
  }
  // fond (#sky-bg, DOM) : 3 couches qui se relaient en poids -> ciel proche,
  // puis halo bleu d'altitude, puis noir de l'espace, exactement la
  // progression de la planche (nuages -> bleu -> espace). Un mélange de
  // couleurs par poids (plutôt que 3 calques en opacité superposés) reste
  // toujours pleinement coloré, jamais de zone sombre entre deux étapes.
  const wDay = 1 - THREE.MathUtils.smoothstep(spaceT, 0, 0.4);
  const wAtmo = THREE.MathUtils.smoothstep(spaceT, 0.15, 0.4) * (1 - THREE.MathUtils.smoothstep(spaceT, 0.55, 0.8));
  const wSpace = THREE.MathUtils.smoothstep(spaceT, 0.55, 0.95);
  const wSum = Math.max(wDay + wAtmo + wSpace, 1e-6);
  const mixColor = (a, b, c) => new THREE.Color(
    (a.r * wDay + b.r * wAtmo + c.r * wSpace) / wSum,
    (a.g * wDay + b.g * wAtmo + c.g * wSpace) / wSum,
    (a.b * wDay + b.b * wAtmo + c.b * wSpace) / wSum,
  );
  const skyBottom = mixColor(SKY_DAY.bottom, SKY_ATMO.bottom, SKY_SPACE);
  const skyTop = mixColor(SKY_DAY.top, SKY_ATMO.top, SKY_SPACE);
  skyBgEl.style.background = `linear-gradient(to top, ${skyBottom.getStyle()} 0%, ${skyTop.getStyle()} 100%)`;
  starsMat.opacity = wSpace;
  // le brouillard doit toujours rester DERRIÈRE tout ce qui est encore
  // visible -> calé sur la distance RÉELLE caméra-cible plutôt que sur spaceT
  // seul (la caméra recule bien plus vite que spaceT ne progresse à cause du
  // rattrapage cumulatif par frame ci-dessus ; un brouillard qui ne suivait
  // que spaceT restait trop court et noyait tout le sol dans un mur ambré).
  scene.fog.far = Math.max(170, camDist + 150);
  scene.fog.near = Math.max(70, camDist - 120);
  neighborPlanet.rotation.y += dt * 0.05;
  neighborLabel.material.opacity = spaceT;
  sun.intensity = THREE.MathUtils.lerp(2.0, 0.4, spaceT);
  sun.castShadow = spaceT < 0.5;
  renderer.shadowMap.enabled = spaceT < 0.5;
  // courbure « petite planète » en 2 temps : (1) monte vite tôt pour qu'on
  // voie déjà un horizon rond dès la vue « région » ; (2) continue ensuite à
  // se resserrer jusqu'à la fin du dézoom. 5000 (pas un nombre énorme type
  // 1e7) reste imperceptiblement plat au zoom de jeu tout en évitant les
  // soucis de précision flottante sur `planetShell` (rayon = cette valeur).
  const curveNear = THREE.MathUtils.smoothstep(spaceT, 0, 0.22);
  const curveFar = THREE.MathUtils.smoothstep(spaceT, 0.32, 1);
  const rpNear = THREE.MathUtils.lerp(5000, 190, curveNear);
  const Rp = THREE.MathUtils.lerp(rpNear, 98, curveFar);
  planetRadiusUniform.value = Rp;
  // coque : MÊME équation que la courbure du sol (`y = -Rp + sqrt(Rp²-d²)`
  // est l'équation d'une sphère de rayon Rp centrée en (cx,-Rp,cz)) -> une
  // sphère unité mise à l'échelle/repositionnée avec CE Rp reste toujours
  // parfaitement continue avec le sol, sous n'importe quel angle de caméra.
  // Décalée d'une épaisseur CONSTANTE (0.15, pas un rayon rétréci en %) :
  // rétrécir le RAYON (essayé d'abord) crée un écart qui grandit avec la
  // distance au centre -> quasi nul près de l'apex mais ~2 unités pile à la
  // jointure avec le bord du sol (96) à rayon de courbure serré (98), assez
  // pour créer une marche visible à cet endroit précis. Translater le CENTRE
  // vers le bas d'une petite constante garde un écart UNIFORME à tout d.
  planetShell.scale.setScalar(Rp);
  planetShell.position.set(PLANET_CENTER.x, -Rp - 0.15, PLANET_CENTER.z);

  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - fpsTime >= 1000) {
    fpsEl.textContent = `${frames} FPS`;
    fpsEl.style.color = frames >= 55 ? '#7ee08a' : frames >= 30 ? '#ffd94a' : '#ff8a7a';
    frames = 0; fpsTime = now;
  }
}
loop();
</script>
</body>

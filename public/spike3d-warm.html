<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Eluminia — Spike 3D chaleureux (100% procédural)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  #hud { position: fixed; top: 10px; left: 10px; background: rgba(60,42,30,0.82); color: #fff3d8;
         padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 360px; }
  #fps { position: fixed; top: 10px; right: 10px; background: rgba(60,42,30,0.82); color: #7ee08a;
         padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: bold; }
  #interact-hint { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(6px);
         background: rgba(60,42,30,0.85); color: #fff3d8; padding: 6px 14px; border-radius: 20px;
         font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #interact-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #dialogue-box { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
         width: min(560px, 86vw); background: linear-gradient(#7a5334, #5b3d23); border: 3px solid #3d2a18;
         border-radius: 16px; padding: 14px 20px; color: #fff6de; opacity: 0; pointer-events: none;
         transition: opacity .2s, transform .2s; box-shadow: 0 10px 24px rgba(0,0,0,0.35); cursor: pointer; }
  #dialogue-box.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #dialogue-box .name { font-weight: 800; color: #ffd39b; margin-bottom: 4px; font-size: 14px; }
  #dialogue-box .text { font-size: 14px; line-height: 1.5; }
  #dialogue-box .continue { text-align: right; font-size: 11px; opacity: .75; margin-top: 6px; font-style: italic; }
</style>
</head>
<body>
<div id="hud">Chargement…</div>
<div id="fps">— FPS</div>
<div id="interact-hint">Appuie sur E pour parler</div>
<div id="dialogue-box">
  <div class="name"></div>
  <div class="text"></div>
  <div class="continue">clique ou Espace pour continuer</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
// ============================================================
// SPIKE 3D « chaleureux » — démonstration technique.
// 100% procédural (zéro asset externe, zéro GLB) : toon shading
// + contours peints (inverted hull) + palette bonbon Eluminia,
// pour juger si le rendu 3D peut atteindre la chaleur du 2D validé.
// ============================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.addEventListener('error', e => {
  document.getElementById('hud').innerHTML = `<b>Erreur :</b> ${e.message}`;
});

const hud = document.getElementById('hud');
const fpsEl = document.getElementById('fps');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffe3b0, 70, 160);

// caméra isométrique douce (orthographique, 3/4 haute) — zoomée pour rester
// intime et chaleureuse plutôt que lointaine/plate (le frustum pilote le
// zoom en orthographique, pas la distance de la caméra)
const frustum = 13;
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-frustum * aspect / 2, frustum * aspect / 2, frustum / 2, -frustum / 2, 0.1, 600);
camera.position.set(26, 24, 26);
camera.lookAt(0, 2, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.target.set(0, 2, 0);
controls.minZoom = 0.6; controls.maxZoom = 2.2;
controls.enablePan = false;

// -------- gradient toon partagé (3 tons chauds + un liseré prune) --------
function makeToonGradient(colors) {
  const c = document.createElement('canvas');
  c.width = colors.length; c.height = 1;
  const ctx = c.getContext('2d');
  colors.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(i, 0, 1, 1); });
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}
const warmGradient = makeToonGradient(['#5b4468', '#c9825f', '#ffd39b', '#fff6de']);
const OUTLINE = 0x3d2f52;

function addOutline(mesh, scale = 1.06) {
  const outline = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial({ color: OUTLINE, side: THREE.BackSide, fog: true }));
  outline.scale.setScalar(scale);
  mesh.add(outline);
  return outline;
}
function toon(geo, color, opts = {}) {
  const mat = new THREE.MeshToonMaterial({ color, gradientMap: warmGradient, flatShading: opts.flat ?? true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  if (opts.outline !== false) addOutline(mesh, opts.outlineScale ?? 1.06);
  return mesh;
}
function emissive(geo, color, intensity = 1.4) {
  const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, toneMapped: false });
  const mesh = new THREE.Mesh(geo, mat);
  return mesh;
}

// -------- lumière dorée d'après-midi --------
scene.add(new THREE.AmbientLight(0xffe9c4, 0.5));
const sun = new THREE.DirectionalLight(0xffdca0, 2.0);
sun.position.set(18, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -35; sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35; sun.shadow.camera.bottom = -35;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xff9e6b, 0.55); // contre-jour chaud, pas un voile plein écran
rim.position.set(-14, 10, -18);
scene.add(rim);

// -------- ciel dégradé (pêche horizon → bleu doux zénith) --------
const skyGeo = new THREE.SphereGeometry(280, 24, 16);
const pos = skyGeo.attributes.position;
const skyColors = new Float32Array(pos.count * 3);
const top = new THREE.Color(0x8fd0ff), bottom = new THREE.Color(0xffe0ac);
for (let i = 0; i < pos.count; i++) {
  const t = THREE.MathUtils.clamp((pos.getY(i) + 20) / 260, 0, 1);
  const c = bottom.clone().lerp(top, t);
  skyColors[i * 3] = c.r; skyColors[i * 3 + 1] = c.g; skyColors[i * 3 + 2] = c.b;
}
skyGeo.setAttribute('color', new THREE.BufferAttribute(skyColors, 3));
scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));

// -------- sol --------
const groundEdge = toon(new THREE.CircleGeometry(92, 48), 0x6fae4f, { outline: false, flat: false });
groundEdge.rotation.x = -Math.PI / 2; groundEdge.position.y = -0.05; groundEdge.receiveShadow = true;
scene.add(groundEdge);
const ground = toon(new THREE.CircleGeometry(88, 48), 0x8fd66a, { outline: false, flat: false });
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

// -------- touffes d'herbe et fleurs (dispersion procédurale) --------
const flowerColors = [0xff9ec7, 0xffd166, 0xffffff, 0xb79bea];
function scatter(count, radiusMin, radiusMax, fn) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = radiusMin + Math.random() * (radiusMax - radiusMin);
    fn(Math.cos(a) * r, Math.sin(a) * r, i);
  }
}
scatter(70, 4, 82, (x, z) => {
  const tuft = toon(new THREE.ConeGeometry(0.14, 0.4, 5), 0x6fc153, { outlineScale: 1.12 });
  tuft.position.set(x, 0.2, z);
  tuft.rotation.y = Math.random() * Math.PI;
  scene.add(tuft);
});
scatter(46, 5, 80, (x, z, i) => {
  const flower = toon(new THREE.SphereGeometry(0.11, 6, 5), flowerColors[i % flowerColors.length], { outlineScale: 1.15 });
  flower.position.set(x, 0.32, z);
  scene.add(flower);
});

// -------- arbres bonbon (3 palettes, feuillage en boules facettées) --------
const treePalettes = [
  { foliage: [0x7fd07a, 0x5fb562, 0x9adf8f] },
  { foliage: [0x8fe0d0, 0x6fc7b8, 0xa8ecdf] },
  { foliage: [0xf3a6c9, 0xe084b0, 0xffc2dd] },
];
function makeCandyTree(palette) {
  const g = new THREE.Group();
  const trunk = toon(new THREE.CylinderGeometry(0.16, 0.22, 1.3, 7), 0x8a5a3a, { outlineScale: 1.08 });
  trunk.position.y = 0.65;
  g.add(trunk);
  const spots = [[0, 1.55, 0.62], [0.42, 1.95, 0.5], [-0.4, 1.9, 0.46], [0, 2.35, 0.4]];
  spots.forEach(([x, y, r], i) => {
    const ball = toon(new THREE.IcosahedronGeometry(r, 0), palette.foliage[i % palette.foliage.length], { outlineScale: 1.07 });
    ball.position.set(x, y, 0);
    g.add(ball);
  });
  return g;
}
scatter(11, 14, 78, (x, z) => {
  const t = makeCandyTree(treePalettes[Math.floor(Math.random() * treePalettes.length)]);
  t.position.set(x, 0, z);
  t.scale.setScalar(0.85 + Math.random() * 0.5);
  t.rotation.y = Math.random() * Math.PI * 2;
  scene.add(t);
});

// -------- maisons rondes à toit bombé --------
function makeRoundHouse(bodyColor, roofColor) {
  const g = new THREE.Group();
  const body = toon(new THREE.CylinderGeometry(1.5, 1.6, 1.7, 14), bodyColor, { outlineScale: 1.04 });
  body.position.y = 0.85;
  g.add(body);
  const roof = toon(new THREE.SphereGeometry(1.75, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), roofColor, { outlineScale: 1.05 });
  roof.position.y = 1.7;
  g.add(roof);
  const door = toon(new THREE.CapsuleGeometry(0.32, 0.35, 3, 8), 0x5b3d2b, { outlineScale: 1.08 });
  door.rotation.x = Math.PI / 2;
  door.position.set(0, 0.45, 1.42);
  g.add(door);
  for (const side of [-1, 1]) {
    const window_ = emissive(new THREE.CircleGeometry(0.22, 12), 0xfff2c4, 1.1);
    window_.position.set(side * 0.85, 1.0, 1.4);
    window_.lookAt(window_.position.x * 3, 1.0, 4);
    g.add(window_);
  }
  return g;
}
const houseSpecs = [
  { pos: [-9, 0, -4], body: 0xff9e7a, roof: 0xe8735a },
  { pos: [7, 0, -7], body: 0x6fd8c9, roof: 0x3fada0 },
  { pos: [10, 0, 5], body: 0xc9a8f0, roof: 0x9a6fd6 },
];
for (const h of houseSpecs) {
  const house = makeRoundHouse(h.body, h.roof);
  house.position.set(...h.pos);
  house.rotation.y = Math.random() * Math.PI * 2;
  scene.add(house);
}

// -------- arbre doré central (fruits + halo magique) --------
const goldenTree = new THREE.Group();
const gTrunk = toon(new THREE.CylinderGeometry(0.4, 0.55, 2.4, 8), 0x8a5a3a, { outlineScale: 1.05 });
gTrunk.position.y = 1.2;
goldenTree.add(gTrunk);
const gFoliage = toon(new THREE.IcosahedronGeometry(2.1, 0), 0x6fb562, { outlineScale: 1.05 });
gFoliage.position.y = 3.4;
goldenTree.add(gFoliage);
const fruits = [];
const fruitSpots = Array.from({ length: 9 }, (_, i) => {
  const a = (i / 9) * Math.PI * 2;
  return [Math.cos(a) * 1.9, 3.1 + Math.sin(i * 1.7) * 0.6, Math.sin(a) * 1.9];
});
for (const [x, y, z] of fruitSpots) {
  const fruit = emissive(new THREE.SphereGeometry(0.24, 10, 8), 0xffcf4a, 1.6);
  fruit.position.set(x, y, z);
  goldenTree.add(fruit);
  fruits.push(fruit);
}
const treeGlow = new THREE.PointLight(0xffd27a, 1.4, 9, 2);
treeGlow.position.set(0, 3.4, 0);
goldenTree.add(treeGlow);
goldenTree.position.set(-2, 0, 3);
scene.add(goldenTree);

// -------- lucioles (points additifs) --------
function makeGlowSprite() {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  grad.addColorStop(0, 'rgba(255,230,150,1)');
  grad.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
}
const fireflyCount = 26;
const fireflyGeo = new THREE.BufferGeometry();
const fireflyPos = new Float32Array(fireflyCount * 3);
const fireflyPhase = new Float32Array(fireflyCount);
for (let i = 0; i < fireflyCount; i++) {
  const a = Math.random() * Math.PI * 2, r = 1 + Math.random() * 4;
  fireflyPos[i * 3] = -2 + Math.cos(a) * r;
  fireflyPos[i * 3 + 1] = 1.5 + Math.random() * 3;
  fireflyPos[i * 3 + 2] = 3 + Math.sin(a) * r;
  fireflyPhase[i] = Math.random() * Math.PI * 2;
}
fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPos, 3));
const fireflies = new THREE.Points(fireflyGeo, new THREE.PointsMaterial({
  size: 0.35, map: makeGlowSprite(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
}));
scene.add(fireflies);

// -------- héros chibi (100% primitives, animé procéduralement) --------
function makeChibi({ cloak, skin, hood, tail }) {
  const g = new THREE.Group();
  const parts = {};

  const body = toon(new THREE.CapsuleGeometry(0.42, 0.55, 4, 10), cloak, { outlineScale: 1.07, flat: false });
  body.position.y = 0.78;
  g.add(body); parts.body = body;

  const head = toon(new THREE.SphereGeometry(0.5, 12, 10), skin, { outlineScale: 1.06, flat: false });
  head.position.y = 1.55;
  g.add(head); parts.head = head;

  const hoodMesh = toon(new THREE.SphereGeometry(0.56, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.62), hood, { outlineScale: 1.06, flat: false });
  hoodMesh.position.y = 1.62; hoodMesh.rotation.x = -0.18;
  g.add(hoodMesh); parts.hood = hoodMesh;

  for (const side of [-1, 1]) {
    const eye = toon(new THREE.SphereGeometry(0.065, 8, 6), 0x2c2436, { outline: false, flat: false });
    eye.position.set(side * 0.17, 1.53, 0.44);
    g.add(eye);
    const spark = emissive(new THREE.SphereGeometry(0.02, 6, 6), 0xffffff, 2);
    spark.position.set(side * 0.17 + side * 0.02, 1.56, 0.49);
    g.add(spark);
    const cheek = toon(new THREE.SphereGeometry(0.09, 8, 6), 0xffb0a6, { outline: false, flat: false });
    cheek.scale.set(1, 0.7, 0.4);
    cheek.position.set(side * 0.3, 1.42, 0.38);
    g.add(cheek);
  }

  for (const side of [-1, 1]) {
    const armGeo = new THREE.CapsuleGeometry(0.11, 0.42, 3, 8);
    armGeo.translate(0, -0.21, 0); // pivot à l'épaule pour le balancement
    const arm = toon(armGeo, cloak, { outlineScale: 1.1, flat: false });
    arm.position.set(side * 0.46, 0.95, 0);
    g.add(arm); parts[side < 0 ? 'armL' : 'armR'] = arm;

    const legGeo = new THREE.CapsuleGeometry(0.13, 0.36, 3, 8);
    legGeo.translate(0, -0.18, 0); // pivot à la hanche
    const leg = toon(legGeo, hood, { outlineScale: 1.1, flat: false });
    leg.position.set(side * 0.2, 0.36, 0);
    g.add(leg); parts[side < 0 ? 'legL' : 'legR'] = leg;
  }

  if (tail) {
    const tailMesh = toon(new THREE.ConeGeometry(0.16, 0.6, 8), tail, { outlineScale: 1.1, flat: false });
    tailMesh.position.set(0, 0.55, -0.4);
    tailMesh.rotation.x = Math.PI * 0.55;
    g.add(tailMesh); parts.tail = tailMesh;
    const ears = [-1, 1].map(side => {
      const ear = toon(new THREE.ConeGeometry(0.1, 0.22, 6), tail, { outlineScale: 1.1, flat: false });
      ear.position.set(side * 0.16, 1.85, 0.05);
      g.add(ear);
      return ear;
    });
    parts.ears = ears;
  }

  return { group: g, parts };
}

const hero = makeChibi({ cloak: 0x4fae6a, skin: 0xf5c99b, hood: 0x357a52, tail: null });
hero.group.position.set(0, 0, -4);
scene.add(hero.group);

// lanterne portée (callback scénario : la lumière renaît avec le savoir)
const lantern = emissive(new THREE.SphereGeometry(0.14, 10, 8), 0xffd27a, 1.8);
lantern.position.set(0.55, 1.1, 0.15);
hero.group.add(lantern);
const lanternLight = new THREE.PointLight(0xffcf6e, 0.9, 4, 2);
lanternLight.position.copy(lantern.position);
hero.group.add(lanternLight);

// compagnon renard (clin d'œil à Flammi)
const fox = makeChibi({ cloak: 0xe8834a, skin: 0xfff2e0, hood: 0xffffff, tail: 0xe8834a });
fox.group.scale.setScalar(0.55);
fox.group.position.set(1.6, 0, -3);
scene.add(fox.group);

// -------- PNJ : Elda, Gardienne de l'Arbre (test d'interaction) --------
const elda = makeChibi({ cloak: 0xb79bea, skin: 0xf5c99b, hood: 0x8a6fd6, tail: null });
elda.group.position.set(-2, 0, 5.5);
elda.group.rotation.y = Math.PI; // face le héros qui arrive du sud
scene.add(elda.group);

const markerCanvas = document.createElement('canvas');
markerCanvas.width = markerCanvas.height = 64;
const mctx = markerCanvas.getContext('2d');
mctx.font = 'bold 46px "Segoe UI"';
mctx.fillStyle = '#fff3d8';
mctx.strokeStyle = '#3d2a18';
mctx.lineWidth = 6;
mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
mctx.strokeText('!', 32, 30);
mctx.fillText('!', 32, 30);
const markerSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(markerCanvas), depthTest: false }));
markerSprite.scale.set(0.5, 0.5, 1);
markerSprite.position.set(0, 2.5, 0);
elda.group.add(markerSprite);

const ELDA_LINES = [
  ['Elda', 'Bienvenue près de l’Arbre Doré, jeune éclaireur.'],
  ['Elda', 'Ce banc n’est qu’un essai : décors et personnages sont générés par code, aucun asset dessiné.'],
  ['Elda', 'Si le style te plaît, dis-le à Camille — c’est lui qui décide de la suite.'],
];
const dialogue = { open: false, index: 0, active: null, canTalk: false };
const hintEl = document.getElementById('interact-hint');
const boxEl = document.getElementById('dialogue-box');
const nameEl = boxEl.querySelector('.name');
const textEl = boxEl.querySelector('.text');

function openDialogue(lines) {
  dialogue.open = true; dialogue.index = 0; dialogue.active = lines;
  moving = false;
  hintEl.classList.remove('show');
  showLine();
}
function showLine() {
  const [name, text] = dialogue.active[dialogue.index];
  nameEl.textContent = name; textEl.textContent = text;
  boxEl.classList.add('show');
}
function advanceDialogue() {
  dialogue.index++;
  if (dialogue.index >= dialogue.active.length) {
    dialogue.open = false; dialogue.active = null;
    boxEl.classList.remove('show');
    return;
  }
  showLine();
}
boxEl.addEventListener('pointerdown', e => { e.stopPropagation(); advanceDialogue(); });
addEventListener('keydown', e => {
  if (dialogue.open && (e.key === ' ' || e.key === 'Enter')) { advanceDialogue(); return; }
  if (!dialogue.open && (e.key === 'e' || e.key === 'E') && dialogue.canTalk) openDialogue(ELDA_LINES);
});

// hooks de test (banc d'essai uniquement, sans impact gameplay)
window.__spikeDebug = {
  gotoElda: () => { moveTarget.copy(elda.group.position); moving = true; },
  openDialogue: () => openDialogue(ELDA_LINES),
  advanceDialogue,
};

function report() {
  hud.innerHTML =
    `<b>Spike 3D chaleureux — banc d'essai</b><br>` +
    `100% procédural : toon shading + contours peints (inverted hull), 0 asset externe.<br>` +
    `<i>Clic gauche : déplacer le héros. Clic droit : orbiter. Molette : zoom.<br>Approche-toi d'Elda (robe violette) puis E pour parler.</i>`;
}
report();

// -------- déplacement au clic (raycast sur le sol) --------
const ray = new THREE.Raycaster();
const moveTarget = new THREE.Vector3();
let moving = false;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0 || dialogue.open) return;
  ray.setFromCamera({ x: (e.clientX / innerWidth) * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
  const hit = ray.intersectObject(ground)[0];
  if (hit) { moveTarget.copy(hit.point); moving = true; }
});

addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left = -frustum * aspect / 2;
  camera.right = frustum * aspect / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// -------- boucle --------
let frames = 0, fpsTime = performance.now(), t = 0;
const clock = new THREE.Clock();

function animateWalk(chibi, dt, walking) {
  const speed = walking ? 8 : 2.2;
  t += dt * speed;
  const bob = walking ? Math.abs(Math.sin(t)) * 0.09 : Math.sin(t * 0.6) * 0.02;
  chibi.group.position.y = bob;
  chibi.parts.hood.rotation.z = Math.sin(t * 0.5) * 0.05;
  const swing = walking ? Math.sin(t) * 0.55 : 0;
  chibi.parts.legL.rotation.x = swing;
  chibi.parts.legR.rotation.x = -swing;
  chibi.parts.armL.rotation.x = -swing * 0.8;
  chibi.parts.armR.rotation.x = swing * 0.8;
  if (chibi.parts.tail) chibi.parts.tail.rotation.z = Math.sin(t * 0.8) * 0.25;
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);

  const distToElda = hero.group.position.distanceTo(elda.group.position);
  dialogue.canTalk = distToElda < 2.4 && !dialogue.open;
  hintEl.classList.toggle('show', dialogue.canTalk);
  markerSprite.visible = !dialogue.open;

  let walking = false;
  if (moving && !dialogue.open) {
    const d = moveTarget.clone().sub(hero.group.position); d.y = 0;
    const dist = d.length();
    if (dist > 0.15) {
      hero.group.position.addScaledVector(d.normalize(), Math.min(dist, 5 * dt));
      hero.group.rotation.y = Math.atan2(d.x, d.z);
      walking = true;
    } else {
      moving = false;
    }
  }
  animateWalk(hero, dt, walking);

  fox.group.position.x = hero.group.position.x + 1.6;
  fox.group.position.z = hero.group.position.z - 1.1;
  animateWalk(fox, dt, walking);
  animateWalk(elda, dt, false);

  fruits.forEach((f, i) => { f.position.y += Math.sin(performance.now() * 0.002 + i) * 0.0006; f.rotation.y += dt * 0.6; });
  treeGlow.intensity = 1.2 + Math.sin(performance.now() * 0.003) * 0.3;

  const fp = fireflyGeo.attributes.position;
  for (let i = 0; i < fireflyCount; i++) {
    const ph = fireflyPhase[i] + performance.now() * 0.0006;
    fp.array[i * 3 + 1] += Math.sin(ph) * 0.0015;
  }
  fp.needsUpdate = true;

  controls.target.lerp(new THREE.Vector3(hero.group.position.x, 1.2, hero.group.position.z), 0.06);
  controls.update();

  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - fpsTime >= 1000) {
    fpsEl.textContent = `${frames} FPS`;
    fpsEl.style.color = frames >= 55 ? '#7ee08a' : frames >= 30 ? '#ffd94a' : '#ff8a7a';
    frames = 0; fpsTime = now;
  }
}
loop();
</script>
</body>
</html>

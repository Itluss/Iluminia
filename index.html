<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Illuminia</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="ui/theme.css" />
<style>
/* =====================================================================
   HOME SCREEN — reproduction de la maquette Camille (2026-08-11)
   Composition : carte joueur (haut gauche) · monnaies + menu (haut
   droite) · navigation verticale (gauche) · cartes événements (droite)
   · défi du jour (bas gauche) · JOUER (bas droite) · Max + pet en 3D
   au centre. Aucun scroll (paysage), 100dvh/100dvw, safe areas,
   états hover/press, tout en composants réutilisables.
   ===================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; width: 100dvw; height: 100dvh; overflow: hidden;
  overscroll-behavior: none; font-family: var(--el-font); background: var(--el-bg-deep); }
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --hs-pad: clamp(10px, 2dvmin, 18px);
  /* hauteur pilotée par l'écran : carte joueur + 5 boutons + défi + marges
     totalisent ~80dvh quel que soit l'appareil — zéro débordement possible */
  --nav-h: clamp(26px, 8dvh, 48px);
  --row-gap: clamp(4px, 1.3dvh, 10px);
}

/* ---------- fond peint (monde coloré derrière Max) ---------- */
#world-bg { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; }
/* héros pré-rendu (Max + chien + plateforme) : une IMAGE — s'affiche
   partout, sur tous les navigateurs, toujours pile au centre */
#hero { position: fixed; left: 50%; bottom: clamp(46px, 13dvh, 90px);
  transform: translateX(-50%); height: min(60dvh, 46dvw); z-index: 1;
  pointer-events: none; filter: drop-shadow(0 12px 20px rgba(10,18,48,0.4));
  animation: heroFloat 5s ease-in-out infinite alternate; }
@keyframes heroFloat { from { transform: translateX(-50%) translateY(0); }
  to { transform: translateX(-50%) translateY(-1.6%); } }

/* ---------- grille générale ---------- */
#hud { position: fixed; inset: 0; z-index: 2; display: grid; pointer-events: none;
  padding: calc(var(--hs-pad) + var(--safe-top)) calc(var(--hs-pad) + var(--safe-right))
           calc(var(--hs-pad) + var(--safe-bottom)) calc(var(--hs-pad) + var(--safe-left));
  grid-template-columns: auto 1fr auto;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "tl . tr"
    "nav . right"
    "defi . play";
  gap: var(--row-gap); }
#hud > * { pointer-events: auto; }

/* ---------- composant : plaque cartoon générique ---------- */
.plate { background: linear-gradient(180deg, var(--el-bg-panel-light), var(--el-bg-panel));
  border: var(--el-border-w) solid var(--el-outline); border-radius: var(--el-radius-md);
  box-shadow: 0 4px 0 rgba(4,9,28,0.55), inset 0 2px 0 rgba(255,255,255,0.18); }

/* ---------- carte joueur (haut gauche) ---------- */
#player-card { grid-area: tl; display: flex; align-items: center; gap: 9px;
  padding: clamp(4px, 1.4dvh, 8px) 24px clamp(4px, 1.4dvh, 8px) clamp(4px, 1.4dvh, 8px); width: max-content; position: relative; }
#player-card .avatar { width: clamp(34px, 11dvh, 56px); height: clamp(34px, 11dvh, 56px);
  border-radius: 14px; border: 3px solid var(--el-outline); position: relative; flex: 0 0 auto;
  background: radial-gradient(circle at 35% 30%, #6fb7ff, #258cff 70%); overflow: hidden; }
.avatar .hair { position: absolute; top: -6%; left: 8%; right: 8%; height: 52%;
  background: #5a3d28; border-radius: 50% 50% 42% 42%; }
.avatar .face { position: absolute; top: 34%; left: 18%; right: 18%; height: 52%;
  background: #ffd9b0; border-radius: 46%; }
.avatar .eye { position: absolute; top: 56%; width: 9%; height: 13%; background: #26221f; border-radius: 50%; }
.avatar .eye.l { left: 34%; } .avatar .eye.r { right: 34%; }
.avatar .lvl-badge { position: absolute; bottom: -4%; left: -4%; width: 40%; height: 40%;
  background: linear-gradient(180deg, var(--el-success), var(--el-success-dark));
  border: 2.5px solid var(--el-outline); border-radius: 50%; display: flex; align-items: center;
  justify-content: center; color: #fff; font-weight: 900; font-size: 55%; }
#player-card .who { display: flex; flex-direction: column; gap: 3px; }
#player-card .name { color: #fff; font-weight: 900; font-size: min(18px, 4.4dvh); letter-spacing: 0.5px; }
#player-card .lvl { color: var(--el-gold); font-weight: 800; font-size: min(13px, 3.2dvh);
  display: flex; align-items: center; gap: 4px; }
#player-card .lvl .el-icon { width: 12px; height: 12px; fill: var(--el-gold); }
.xp-track { width: clamp(90px, 26dvh, 150px); height: clamp(8px, 2.6dvh, 12px); border-radius: 999px;
  background: rgba(4,9,28,0.6); border: 2px solid var(--el-outline); overflow: hidden; position: relative; }
.xp-fill { height: 100%; width: 62.5%; border-radius: 999px;
  background: linear-gradient(180deg, #7fe3ff, var(--el-cyan) 55%, var(--el-cyan-dark)); }
.xp-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 900; font-size: 8.5px; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
#xp-chip { position: absolute; top: -9px; right: -13px; background: linear-gradient(180deg, #5fc0ff, #1c72c9);
  border: 3px solid var(--el-outline); border-radius: 12px; color: #fff; font-weight: 900;
  font-size: clamp(10px, 2dvmin, 13px); padding: 4px 9px;
  box-shadow: 0 3px 0 rgba(4,9,28,0.55), inset 0 2px 0 rgba(255,255,255,0.3); }

/* ---------- monnaies + menu (haut droite) ---------- */
#top-right { grid-area: tr; display: flex; align-items: flex-start; gap: clamp(6px, 1.4dvmin, 12px); justify-self: end; }
.capsule { display: flex; align-items: center; gap: 7px; background: rgba(10,18,48,0.92);
  border: 3px solid var(--el-outline); border-radius: 999px; padding: 5px 6px 5px 8px;
  box-shadow: 0 3px 0 rgba(4,9,28,0.55), inset 0 2px 0 rgba(255,255,255,0.12); }
.capsule .el-icon { width: min(21px, 4.6dvh); height: min(21px, 4.6dvh); }
.capsule .val { color: #fff; font-weight: 900; font-size: min(16px, 4dvh); letter-spacing: 0.5px; }
.capsule .add { width: min(23px, 5dvh); height: min(23px, 5dvh); border-radius: 50%;
  background: linear-gradient(180deg, #7fe08a, var(--el-success) 55%, var(--el-success-dark));
  border: 2.5px solid var(--el-outline); display: flex; align-items: center; justify-content: center;
  cursor: pointer; }
.capsule .add .el-icon { width: 60%; height: 60%; fill: #fff; stroke: #fff; }
.capsule .add:active { transform: translateY(1px); }
#coin-capsule .el-icon { fill: var(--el-gold); }
#gem-capsule .el-icon { fill: var(--el-purple); }
#burger { position: relative; width: min(52px, 11dvh); height: min(52px, 11dvh);
  border-radius: var(--el-radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, var(--el-bg-panel-light), var(--el-bg-panel));
  border: 3px solid var(--el-outline); box-shadow: 0 4px 0 rgba(4,9,28,0.55), inset 0 2px 0 rgba(255,255,255,0.18); }
#burger .el-icon { width: 55%; height: 55%; color: #fff; }
#burger:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(4,9,28,0.55); }

/* ---------- badge notification (rond rouge) ---------- */
.badge { position: absolute; top: -7px; right: -7px; min-width: min(20px, 4.8dvh); height: min(20px, 4.8dvh); padding: 0 5px;
  background: linear-gradient(180deg, #ff7583, var(--el-danger) 55%, var(--el-danger-dark));
  border: 2px solid var(--el-outline); border-radius: 999px; color: #fff; font-weight: 900;
  font-size: min(11px, 2.8dvh); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 0 rgba(4,9,28,0.4); }

/* ---------- navigation verticale (gauche) ---------- */
#side-nav { grid-area: nav; display: flex; flex-direction: column; gap: var(--row-gap);
  align-self: start; margin-top: clamp(4px, 1.6dvh, 16px); }
/* maquette : chaque bouton est une PLATE PLEINE COULEUR, coins très
   arrondis, contour épais, lèvre d'ombre colorée — l'icône vit dans une
   tuile crème arrondie à gauche */
.nav-btn { position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer;
  height: var(--nav-h); width: clamp(138px, 38dvh, 186px); padding: 0 8px 0 4px;
  border: 3px solid var(--el-outline); border-radius: clamp(10px, 3.4dvh, 16px);
  background: linear-gradient(180deg, var(--pl-top), var(--pl-mid) 55%, var(--pl-bot));
  box-shadow: 0 4px 0 var(--pl-lip), 0 7px 10px rgba(4,9,28,0.35), inset 0 2px 0 rgba(255,255,255,0.35); }
.nav-btn::after { content: ""; position: absolute; left: 6%; right: 6%; top: 7%; height: 30%;
  border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.05));
  pointer-events: none; }
.nav-btn:hover { filter: brightness(1.07); }
.nav-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pl-lip), inset 0 2px 0 rgba(255,255,255,0.35); }
.nav-ico { width: calc(var(--nav-h) - 12px); height: calc(var(--nav-h) - 12px); flex: 0 0 auto;
  border-radius: 11px; border: 2.5px solid var(--el-outline); background: linear-gradient(180deg, #fffdf2, var(--el-cream));
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 -3px 0 rgba(160,120,60,0.35); }
.nav-ico .el-icon { width: 64%; height: 64%; fill: var(--pl-ico); color: var(--pl-ico); }
.nav-btn .lbl { color: #fff; font-weight: 900; font-size: min(12px, 3.3dvh); letter-spacing: 0.3px;
  text-shadow: 0 1.5px 0 rgba(10,18,48,0.55); }
.plate-orange { --pl-top: #ffb35c; --pl-mid: var(--el-orange); --pl-bot: var(--el-orange-dark); --pl-lip: #a04d04; --pl-ico: var(--el-orange-dark); }
.plate-cyan { --pl-top: #7fe3ff; --pl-mid: var(--el-cyan); --pl-bot: var(--el-cyan-dark); --pl-lip: #086b80; --pl-ico: var(--el-cyan-dark); }
.plate-purple { --pl-top: #b28aff; --pl-mid: var(--el-purple); --pl-bot: var(--el-purple-dark); --pl-lip: #45208f; --pl-ico: var(--el-purple-dark); }
.plate-blue { --pl-top: #6fb7ff; --pl-mid: var(--el-blue); --pl-bot: var(--el-blue-dark); --pl-lip: #0d3f85; --pl-ico: var(--el-blue-dark); }
.plate-navy { --pl-top: #3a5799; --pl-mid: #2a4076; --pl-bot: #1c2c55; --pl-lip: #0a1230; --pl-ico: #2a4076; }

/* ---------- cartes événements (droite) ---------- */
#right-stack { grid-area: right; display: flex; flex-direction: column; gap: clamp(6px, 1.4dvmin, 11px);
  align-self: start; justify-self: end; margin-top: clamp(14px, 6dvh, 44px);
  width: clamp(140px, 40dvh, 205px); }
.event-card { position: relative; padding: clamp(4px, 1.5dvh, 8px) 10px; cursor: pointer; border-radius: var(--el-radius-md);
  border: var(--el-border-w) solid var(--el-outline);
  box-shadow: 0 4px 0 rgba(4,9,28,0.55), inset 0 2px 0 rgba(255,255,255,0.22); }
.event-card:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(4,9,28,0.55); }
.event-card .t { color: #fff; font-weight: 900; font-size: min(13px, 3.2dvh); letter-spacing: 0.6px; }
.event-card .sub { margin-top: 4px; display: flex; align-items: center; gap: 6px; }
#card-event { background: linear-gradient(180deg, #9a68f7, var(--el-purple-dark)); }
#card-event .pill { background: rgba(10,18,48,0.75); border: 2px solid var(--el-outline);
  border-radius: 999px; padding: 2.5px 8px; color: var(--el-cream); font-weight: 800; font-size: 10.5px; }
#card-event .pill b { color: var(--el-gold); }
#card-xp { background: linear-gradient(160deg, #9a68f7, var(--el-magenta) 70%, var(--el-magenta-dark)); display: flex; align-items: center; gap: 9px; }
#card-xp .hex { flex: 0 0 auto; width: min(38px, 8.4dvh); height: min(38px, 8.4dvh);
  background: linear-gradient(180deg, #ffe082, var(--el-gold) 55%, var(--el-gold-dark));
  border: 2.5px solid var(--el-outline); border-radius: 10px; transform: rotate(45deg);
  display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35); }
#card-xp .hex span { transform: rotate(-45deg); color: #5a2f8f; font-weight: 900; font-size: clamp(11px, 2dvmin, 14px); }
#card-xp .txt .t { line-height: 1.1; }
#card-xp .txt .pct { color: var(--el-cream); font-weight: 800; font-size: 10.5px; }
#card-chest { background: linear-gradient(180deg, var(--el-bg-panel-light), var(--el-bg-panel));
  display: flex; align-items: center; gap: 9px; }
#card-chest .chest { flex: 0 0 auto; width: min(38px, 8.4dvh); height: min(38px, 8.4dvh);
  border-radius: 10px; border: 2.5px solid var(--el-outline);
  background: linear-gradient(180deg, #ffb35c, var(--el-orange-dark));
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35); }
#card-chest .chest .el-icon { width: 62%; height: 62%; fill: #7a4a12; }
#card-chest .ready { color: var(--el-success); font-weight: 900; font-size: 11px; }

/* ---------- défi du jour (bas gauche) ---------- */
#daily-card { grid-area: defi; align-self: end; display: flex; align-items: center; gap: 9px;
  width: max-content; max-width: min(48dvw, 330px); padding: clamp(4px, 1.6dvh, 9px) 12px;
  background: linear-gradient(180deg, #2b6cd9, #1b4ea8); border: var(--el-border-w) solid var(--el-outline);
  border-radius: var(--el-radius-md); box-shadow: 0 4px 0 rgba(4,9,28,0.55), inset 0 2px 0 rgba(255,255,255,0.22); }
#daily-card .gems { flex: 0 0 auto; width: min(42px, 9dvh); height: min(42px, 9dvh);
  border-radius: 11px; border: 2.5px solid var(--el-outline);
  background: linear-gradient(180deg, #7fe3ff, var(--el-cyan-dark));
  display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.4); }
#daily-card .gems .el-icon { width: 62%; height: 62%; fill: #0d5a86; }
#daily-card .txt { display: flex; flex-direction: column; gap: 2px; }
#daily-card .t { color: var(--el-gold); font-weight: 900; font-size: min(13px, 3.2dvh); letter-spacing: 0.6px; white-space: nowrap; }
#daily-card .d1 { color: #fff; font-weight: 800; font-size: min(12.5px, 3dvh); white-space: nowrap; }
#daily-card .d2 { color: var(--el-text-muted); font-weight: 700; font-size: min(11px, 2.7dvh); white-space: nowrap; }
#daily-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-left: 4px; }
#daily-card .prog { color: #fff; font-weight: 900; font-size: min(15px, 3.6dvh); }
#daily-card .reward { background: linear-gradient(180deg, #b28aff, var(--el-purple-dark));
  border: 2.5px solid var(--el-outline); border-radius: 999px; padding: 2.5px 8px;
  color: #fff; font-weight: 900; font-size: 10.5px; display: flex; align-items: center; gap: 3px; }
#daily-card .reward .el-icon { width: 11px; height: 11px; fill: var(--el-gold); }

/* ---------- bouton JOUER (bas droite) ---------- */
#play-btn { grid-area: play; align-self: end; justify-self: end; display: flex; align-items: center;
  justify-content: center; gap: 12px; cursor: pointer;
  width: clamp(180px, 52dvh, 320px); padding: clamp(8px, 3dvh, 20px) 0;
  border-radius: 20px; border: 4px solid var(--el-outline);
  background: linear-gradient(180deg, #ffe082 0%, var(--el-gold) 45%, var(--el-gold-dark) 100%);
  box-shadow: 0 7px 0 #9a6d00, 0 12px 22px rgba(4,9,28,0.5), inset 0 3px 0 rgba(255,255,255,0.55);
  transition: transform 0.06s, box-shadow 0.06s; }
#play-btn:hover { filter: brightness(1.05); }
#play-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #9a6d00, 0 6px 12px rgba(4,9,28,0.5), inset 0 3px 0 rgba(255,255,255,0.55); }
#play-btn .tri { width: min(34px, 7.4dvh); height: min(34px, 7.4dvh);
  display: flex; align-items: center; justify-content: center; }
#play-btn .tri .el-icon { width: 100%; height: 100%; fill: #fff;
  filter: drop-shadow(0 2px 0 rgba(10,18,48,0.55)); }
#play-btn .lbl { color: #fff; font-weight: 900; font-size: min(36px, 8dvh);
  letter-spacing: 2px; -webkit-text-stroke: 1.5px rgba(10,18,48,0.65);
  text-shadow: 0 2.5px 0 rgba(10,18,48,0.55); }

/* ---------- toast « bientôt » ---------- */
#toast { position: fixed; left: 50%; bottom: calc(16px + var(--safe-bottom)); transform: translateX(-50%);
  z-index: 10; background: rgba(10,18,48,0.95); border: 3px solid var(--el-gold);
  border-radius: 999px; color: var(--el-cream); font-weight: 900; font-size: 14px;
  padding: 9px 18px; display: none; }
#toast.show { display: block; }

/* ---------- rotation requise ---------- */
#rotate-prompt { display: none; position: fixed; inset: 0; z-index: 90; background: var(--el-bg-deep);
  color: var(--el-text-main); flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 10px; font-weight: 800; }
@media (orientation: portrait) { #rotate-prompt { display: flex; } }
</style>
</head>
<body>
<canvas id="world-bg"></canvas>
<img id="hero" src="ui/hero-max.png" alt="Max et son compagnon" />

<div id="hud">
  <!-- carte joueur -->
  <div id="player-card" class="plate">
    <div class="avatar">
      <div class="face"></div>
      <div class="hair"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="lvl-badge">✓</div>
    </div>
    <div class="who">
      <span class="name">MAX</span>
      <span class="lvl"><svg class="el-icon"><use href="#icon-star"></use></svg>Niveau 17</span>
      <div class="xp-track"><div class="xp-fill"></div><span class="xp-num">1250/2000</span></div>
    </div>
    <div id="xp-chip">XP</div>
  </div>

  <!-- monnaies + menu -->
  <div id="top-right">
    <div class="capsule" id="coin-capsule">
      <svg class="el-icon"><use href="#icon-coin"></use></svg>
      <span class="val">12 450</span>
      <div class="add" data-soon><svg class="el-icon"><use href="#icon-plus"></use></svg></div>
    </div>
    <div class="capsule" id="gem-capsule">
      <svg class="el-icon"><use href="#icon-gem"></use></svg>
      <span class="val">480</span>
      <div class="add" data-soon><svg class="el-icon"><use href="#icon-plus"></use></svg></div>
    </div>
    <div id="burger" data-soon>
      <svg class="el-icon"><use href="#icon-menu"></use></svg>
      <span class="badge">3</span>
    </div>
  </div>

  <!-- navigation -->
  <div id="side-nav">
    <div class="nav-btn plate-orange" data-href="./spike3d-menu.html">
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-avatar"></use></svg></span>
      <span class="lbl">PERSONNAGE</span>
      <span class="badge">!</span>
    </div>
    <div class="nav-btn plate-cyan" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-paw"></use></svg></span>
      <span class="lbl">PETS</span>
      <span class="badge">5</span>
    </div>
    <div class="nav-btn plate-purple" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-gift"></use></svg></span>
      <span class="lbl">RÉCOMPENSES</span>
      <span class="badge">2</span>
    </div>
    <div class="nav-btn plate-blue" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-book"></use></svg></span>
      <span class="lbl">QUÊTES</span>
    </div>
    <div class="nav-btn plate-navy" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-addPerson"></use></svg></span>
      <span class="lbl">SOCIAL</span>
    </div>
  </div>

  <!-- cartes événements -->
  <div id="right-stack">
    <div class="event-card" id="card-event" data-soon>
      <div class="t">ÉVÉNEMENT</div>
      <div class="sub"><span class="pill">Fin dans : <b id="event-timer">1h 24min</b></span></div>
      <span class="badge">!</span>
    </div>
    <div class="event-card" id="card-xp" data-soon>
      <div class="hex"><span>2x</span></div>
      <div class="txt">
        <div class="t">DOUBLE XP</div>
        <div class="pct">+100%</div>
      </div>
    </div>
    <div class="event-card" id="card-chest" data-soon>
      <div class="chest"><svg class="el-icon"><use href="#icon-gift"></use></svg></div>
      <div class="txt">
        <div class="t">COFFRE GRATUIT</div>
        <div class="ready">Prêt !</div>
      </div>
      <span class="badge">!</span>
    </div>
  </div>

  <!-- défi du jour -->
  <div id="daily-card" data-href="./spike3d-arena.html">
    <div class="gems"><svg class="el-icon"><use href="#icon-gem"></use></svg></div>
    <div class="txt">
      <div class="t">DÉFI DU JOUR</div>
      <div class="d1">Fractions · CM1-CM2</div>
      <div class="d2">Termine 3 parties</div>
    </div>
    <div class="right">
      <span class="prog">2/3</span>
      <span class="reward">+50 <svg class="el-icon"><use href="#icon-star"></use></svg></span>
    </div>
  </div>

  <!-- JOUER -->
  <div id="play-btn" data-href="./spike3d-arena.html">
    <span class="tri"><svg class="el-icon"><use href="#icon-play"></use></svg></span>
    <span class="lbl">JOUER</span>
  </div>
</div>

<div id="toast">✨ Bientôt disponible !</div>
<div id="rotate-prompt">
  <div style="font-size:40px">📱↺</div>
  <div>Tourne ton téléphone en mode paysage&nbsp;!</div>
</div>

<script src="ui/icons.js"></script>
<script>
// navigation + placeholders
document.querySelectorAll('[data-href]').forEach(el =>
  el.addEventListener('click', () => { location.href = el.dataset.href; }));
let toastTimer = 0;
document.querySelectorAll('[data-soon]').forEach(el =>
  el.addEventListener('click', e => {
    e.stopPropagation();
    const t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }));
// compte à rebours de l'événement (purement visuel, 1h24 au chargement)
{
  let secs = (1 * 60 + 24) * 60;
  const el = document.getElementById('event-timer');
  setInterval(() => {
    secs = Math.max(0, secs - 1);
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    el.textContent = h > 0 ? `${h}h ${String(m).padStart(2, '0')}min` : `${m}min ${String(secs % 60).padStart(2, '0')}s`;
  }, 1000);
}

// ---------- fond peint : monde coloré façon maquette ----------
{
  const c = document.getElementById('world-bg');
  const paint = () => {
    const w = c.width = innerWidth * Math.min(devicePixelRatio, 2);
    const h = c.height = innerHeight * Math.min(devicePixelRatio, 2);
    const x = ctxFrac => ctxFrac * w, y = f => f * h;
    const ctx = c.getContext('2d');
    // ciel
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#3f9df8'); sky.addColorStop(0.45, '#6db9ff'); sky.addColorStop(0.75, '#a8d8ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    // soleil doux
    const sun = ctx.createRadialGradient(x(0.72), y(0.16), 0, x(0.72), y(0.16), Math.min(w, h) * 0.3);
    sun.addColorStop(0, 'rgba(255,240,190,0.8)'); sun.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = sun; ctx.fillRect(0, 0, w, h);
    // nuages cartoon
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const cloud = (cx, cy, s) => {
      [[0, 0, 1], [-1.1, 0.18, 0.7], [1.1, 0.2, 0.75], [0.4, -0.4, 0.6], [-0.5, -0.35, 0.55]].forEach(([dx, dy, r]) => {
        ctx.beginPath(); ctx.arc(x(cx) + dx * s, y(cy) + dy * s, r * s, 0, Math.PI * 2); ctx.fill();
      });
    };
    cloud(0.15, 0.14, w * 0.030); cloud(0.55, 0.09, w * 0.023); cloud(0.87, 0.24, w * 0.026);
    // ruines violettes lointaines (silhouettes)
    ctx.fillStyle = 'rgba(138,85,245,0.42)';
    const tower = (cx, base, tw2, th2) => {
      ctx.fillRect(x(cx) - tw2 / 2, y(base) - th2, tw2, th2);
      ctx.beginPath(); ctx.moveTo(x(cx) - tw2 * 0.72, y(base) - th2);
      ctx.lineTo(x(cx), y(base) - th2 - tw2 * 0.9); ctx.lineTo(x(cx) + tw2 * 0.72, y(base) - th2);
      ctx.closePath(); ctx.fill();
    };
    tower(0.09, 0.62, w * 0.045, h * 0.20); tower(0.2, 0.63, w * 0.03, h * 0.13);
    tower(0.86, 0.60, w * 0.05, h * 0.24); tower(0.95, 0.62, w * 0.03, h * 0.12);
    ctx.fillStyle = 'rgba(111,216,255,0.5)';
    const crystal = (cx, base, s) => {
      ctx.beginPath(); ctx.moveTo(x(cx), y(base) - s * 2.6);
      ctx.lineTo(x(cx) + s, y(base)); ctx.lineTo(x(cx) - s, y(base)); ctx.closePath(); ctx.fill();
    };
    crystal(0.3, 0.62, w * 0.012); crystal(0.75, 0.6, w * 0.016); crystal(0.68, 0.63, w * 0.009);
    // collines
    const hill = (cy, col) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, h);
      for (let i = 0; i <= 24; i++) {
        const px = i / 24 * w;
        ctx.lineTo(px, y(cy) + Math.sin(i * 0.9) * h * 0.03);
      }
      ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
    };
    hill(0.66, '#8a55f5'); hill(0.74, '#6a34d6'); hill(0.84, '#53386e');
    // touffes fleuries
    for (let i = 0; i < 40; i++) {
      const fx = Math.random() * w, fy = y(0.7 + Math.random() * 0.28);
      ctx.fillStyle = ['#ef4e9b', '#ffc928', '#20cff3'][i % 3] + 'aa';
      ctx.beginPath(); ctx.arc(fx, fy, w * 0.0035, 0, Math.PI * 2); ctx.fill();
    }
    // vignette
    const vig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.4, w / 2, h / 2, Math.max(w, h) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(14,22,56,0.5)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, w, h);
  };
  paint();
  addEventListener('resize', paint);
}
</script>

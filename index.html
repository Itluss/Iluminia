<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Illuminia</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="ui/theme.css" />
<style>
/* =====================================================================
   HOME SCREEN — PIXEL MATCHING de la maquette (spec Camille 2026-08-12)
   Méthode imposée : SCÈNE LOGIQUE 1536×864 à POSITIONNEMENT ABSOLU,
   mise à l'échelle uniforme scale = min(vw/1536, vh/864) — la
   composition ne se redistribue JAMAIS, elle est identique sur tous les
   écrans. Le fond peint couvre tout le viewport (zones letterbox
   comprises). Aucun emoji dans l'UI (sprite SVG uniquement).
   Coordonnées mesurées sur la planche (zone écran ~1005×550) puis
   converties ×1,528 / ×1,571 vers 1536×864.
   ===================================================================== */
:root { --sal: env(safe-area-inset-left, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; width: 100dvw; height: 100dvh; overflow: hidden;
  overscroll-behavior: none; font-family: var(--el-font); background: var(--el-bg-deep); }

/* ---------- fond peint : couvre TOUT le viewport ---------- */
#world-bg { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; }

/* ---------- scène logique 1536×864 ---------- */
#stage { position: fixed; left: 50%; top: 50%; width: 1536px; height: 864px;
  transform: translate(-50%, -50%); transform-origin: center center; z-index: 1; }

/* héros pré-rendu (Max + chien + plateforme — asset du projet) */
#hero { position: absolute; left: 768px; bottom: 168px; transform: translateX(-50%);
  height: 600px; pointer-events: none;
  filter: drop-shadow(0 14px 22px rgba(10,18,48,0.4));
  animation: heroFloat 5s ease-in-out infinite alternate; }
@keyframes heroFloat { from { transform: translateX(-50%) translateY(0); }
  to { transform: translateX(-50%) translateY(-9px); } }

/* ---------- carte joueur (haut gauche) : x30 y26 ---------- */
#player-card { position: absolute; left: calc(30px - var(--edge-x, 0px)); top: 26px; height: 110px;
  display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 12px;
  background: linear-gradient(180deg, #22375f, #14224a 65%, #14224a);
  border: 4px solid rgba(10,18,48,0.95); border-radius: 24px;
  box-shadow: inset 0 -6px 0 #0c1732, inset 0 3px 0 rgba(255,255,255,0.16), 0 6px 14px rgba(10,18,48,0.4); }
#player-card .avatar { width: 82px; height: 82px; border-radius: 50%;
  border: 4px solid var(--el-purple); box-shadow: 0 0 0 3px rgba(10,18,48,0.8);
  position: relative; flex: 0 0 auto; overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #6fb7ff, #258cff 70%); }
.avatar .hair { position: absolute; top: -6%; left: 8%; right: 8%; height: 52%;
  background: #5a3d28; border-radius: 50% 50% 42% 42%; }
.avatar .face { position: absolute; top: 34%; left: 18%; right: 18%; height: 52%;
  background: #ffd9b0; border-radius: 46%; }
.avatar .eye { position: absolute; top: 56%; width: 9%; height: 13%; background: #26221f; border-radius: 50%; }
.avatar .eye.l { left: 34%; } .avatar .eye.r { right: 34%; }
.avatar .lvl-badge { position: absolute; bottom: 0; left: 0; width: 34%; height: 34%;
  background: linear-gradient(180deg, #7fe08a, var(--el-success) 60%, var(--el-success-dark));
  border: 3px solid rgba(10,18,48,0.85); border-radius: 50%; display: flex; align-items: center;
  justify-content: center; color: #fff; font-weight: 900; font-size: 18px; }
#player-card .who { display: flex; flex-direction: column; gap: 5px; }
#player-card .name { color: #fff; font-weight: 900; font-size: 27px; letter-spacing: 1px; }
#player-card .lvl { color: #fff; font-weight: 800; font-size: 18px;
  display: flex; align-items: center; gap: 7px; }
#player-card .lvl .el-icon { width: 19px; height: 19px; fill: var(--el-gold); }
.xp-track { width: 220px; height: 18px; border-radius: 999px;
  background: rgba(4,9,28,0.6); border: 3px solid rgba(10,18,48,0.9); overflow: hidden; position: relative; }
.xp-fill { height: 100%; width: 62.5%; border-radius: 999px;
  background: linear-gradient(180deg, #7fe3ff, var(--el-cyan) 55%, var(--el-cyan-dark)); }
.xp-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 900; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
/* bouton XP bleu INDÉPENDANT, à droite de la carte */
#xp-chip { position: absolute; left: calc(390px - var(--edge-x, 0px)); top: 34px; padding: 12px 20px;
  background: linear-gradient(180deg, #5fc0ff, #1c72c9 62%, #1c72c9);
  border: 4px solid rgba(10,18,48,0.9); border-radius: 18px; color: #fff; font-weight: 900;
  font-size: 21px; cursor: pointer;
  box-shadow: inset 0 -5px 0 #114a8c, inset 0 3px 0 rgba(255,255,255,0.4), 0 5px 10px rgba(10,18,48,0.4); }
#xp-chip:active { transform: translateY(3px); }

/* ---------- monnaies + menu (haut, alignés droite) ---------- */
#top-right { position: absolute; right: calc(30px - var(--edge-x, 0px)); top: 26px; display: flex; align-items: center; gap: 20px; }
.capsule { display: flex; align-items: center; gap: 10px; height: 62px;
  background: linear-gradient(180deg, #1c2b58, #101c3e);
  border: 4px solid rgba(10,18,48,0.95); border-radius: 999px; padding: 0 10px 0 16px;
  box-shadow: inset 0 3px 0 rgba(255,255,255,0.14), inset 0 -5px 0 rgba(0,0,0,0.35),
    0 5px 12px rgba(10,18,48,0.4); }
.capsule .el-icon { width: 32px; height: 32px; }
.capsule .val { color: #fff; font-weight: 900; font-size: 25px; letter-spacing: 0.5px; }
.capsule .add { width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(180deg, #7fe08a, var(--el-success) 55%, var(--el-success-dark));
  border: 3px solid rgba(10,18,48,0.85); display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: inset 0 2px 0 rgba(255,255,255,0.45); }
.capsule .add .el-icon { width: 60%; height: 60%; fill: #fff; stroke: #fff; }
.capsule .add:active { transform: translateY(2px); }
#coin-capsule .el-icon { fill: var(--el-gold); }
#gem-capsule .el-icon { fill: var(--el-purple); }
#burger { position: relative; width: 118px; height: 74px; border-radius: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #2c4380, #1a2b58 62%, #1a2b58);
  border: 4px solid rgba(10,18,48,0.95);
  box-shadow: inset 0 -6px 0 #0d1834, inset 0 3px 0 rgba(255,255,255,0.2), 0 5px 12px rgba(10,18,48,0.4); }
#burger .el-icon { width: 46px; height: 46px; color: #fff; }
#burger:active { transform: translateY(3px); }

/* ---------- badge notification ---------- */
.badge { position: absolute; top: -10px; right: -10px; min-width: 34px; height: 34px; padding: 0 8px;
  background: linear-gradient(180deg, #ff8290 20%, var(--el-danger) 60%, var(--el-danger-dark));
  border: 3px solid #8f1622; border-radius: 999px; color: #fff; font-weight: 900;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 3px 6px rgba(10,18,48,0.45); }
.badge-green { background: linear-gradient(180deg, #7fe08a 20%, var(--el-success) 60%, var(--el-success-dark)) !important;
  border-color: #1d6b1f !important; }

/* ---------- menu vertical gauche : x30, départ y200 ---------- */
#side-nav { position: absolute; left: calc(30px - var(--edge-x, 0px)); top: 200px; display: flex; flex-direction: column; gap: 16px; }
.nav-btn { position: relative; display: flex; align-items: center; gap: 14px; cursor: pointer;
  height: 82px; width: 280px; padding: 0 15px 0 12px;
  border: 4px solid rgba(10,18,48,0.9); border-radius: 20px;
  background: linear-gradient(180deg, #22375f, #14224a);
  box-shadow: inset 0 -6px 0 rgba(10,18,48,0.32), inset 0 3px 0 rgba(255,255,255,0.3),
    0 6px 14px rgba(10,18,48,0.4); }
.nav-btn::after { content: ""; position: absolute; left: 5px; right: 5px; top: 3px; height: 44%;
  border-radius: 14px 14px 46% 46%;
  background: linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0.1));
  pointer-events: none; }
.nav-btn:hover { filter: brightness(1.06); }
.nav-btn:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(10,18,48,0.32),
  inset 0 3px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(10,18,48,0.4); }
/* tuile d'icône : STYLE EXACT de la tuile du coffre (gradient coloré,
   contour marine, lèvre foncée intégrée, icône en teinte sombre) */
.nav-ico { width: 58px; height: 58px; flex: 0 0 auto;
  border-radius: 22%; border: 3px solid rgba(10,18,48,0.8);
  background: linear-gradient(180deg, var(--tile-top), var(--tile-mid) 62%, var(--tile-mid));
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 -4px 0 var(--tile-lip), inset 0 3px 0 rgba(255,255,255,0.5); }
.nav-ico .el-icon { width: 62%; height: 62%; fill: var(--tile-ico); color: var(--tile-ico); }
.nav-btn .lbl { color: #fff; font-weight: 900; font-size: 20px; letter-spacing: 0.5px;
  text-shadow: 0 2px 0 rgba(10,18,48,0.45); position: relative; z-index: 1; }
.plate-orange { --tile-top: #ffc169; --tile-mid: var(--el-orange); --tile-lip: #cf6a06; --tile-ico: #7a4a12; }
.plate-cyan { --tile-top: #7fe8cf; --tile-mid: #23b898; --tile-lip: #0e7a63; --tile-ico: #084d3e; }
.plate-purple { --tile-top: #bb95ff; --tile-mid: var(--el-purple); --tile-lip: #5c28c4; --tile-ico: #35156e; }
.plate-blue { --tile-top: #6fb7ff; --tile-mid: var(--el-blue); --tile-lip: #0d3f85; --tile-ico: #0d3364; }
.plate-navy { --tile-top: #8fa3cd; --tile-mid: #5a6d95; --tile-lip: #34446b; --tile-ico: #17234a; }

/* ---------- colonne droite : x fixé au bord, départ y215 ---------- */
#right-stack { position: absolute; right: calc(30px - var(--edge-x, 0px)); top: 215px; display: flex; flex-direction: column;
  gap: 18px; width: 268px; }
.event-card { position: relative; padding: 12px 15px; cursor: pointer;
  border-radius: 20px; border: 4px solid rgba(10,18,48,0.9);
  box-shadow: inset 0 -6px 0 rgba(10,18,48,0.32), inset 0 3px 0 rgba(255,255,255,0.3),
    0 6px 14px rgba(10,18,48,0.4); }
.event-card::after { content: ""; position: absolute; left: 5px; right: 5px; top: 3px; height: 44%;
  border-radius: 14px 14px 46% 46%;
  background: linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0.1));
  pointer-events: none; }
.event-card:active { transform: translateY(3px); }
.event-card .t { color: #fff; font-weight: 900; font-size: 20px; letter-spacing: 0.8px;
  position: relative; z-index: 1; }
.event-card .sub { margin-top: 7px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 1; }
#card-event { background: linear-gradient(180deg, #9a68f7, var(--el-purple-dark)); }
#card-event .pill { background: rgba(10,18,48,0.75); border: 3px solid rgba(10,18,48,0.9);
  border-radius: 999px; padding: 5px 13px; color: var(--el-cream); font-weight: 800; font-size: 16px; }
#card-event .pill b { color: var(--el-gold); }
#card-xp { background: linear-gradient(165deg, #a273f8 0%, var(--el-purple) 55%, #b04ac8 100%);
  display: flex; align-items: center; gap: 14px; }
#card-xp .hex { flex: 0 0 auto; width: 58px; height: 58px;
  background: linear-gradient(180deg, #a678f8, var(--el-purple-dark) 70%);
  border: 3.5px solid var(--el-gold); border-radius: 26%; transform: rotate(45deg);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 -4px 0 #4a1e9e, inset 0 3px 0 rgba(255,255,255,0.35), 0 0 0 2px rgba(10,18,48,0.7); }
#card-xp .hex span { transform: rotate(-45deg); color: var(--el-gold); font-weight: 900; font-size: 21px; }
#card-xp .txt .t { line-height: 1.12; }
#card-xp .txt .pct { color: var(--el-cream); font-weight: 800; font-size: 16px; }
#card-chest { background: linear-gradient(180deg, #22375f, #14224a); display: flex; align-items: center; gap: 14px; }
#card-chest .chest { flex: 0 0 auto; width: 58px; height: 58px;
  border-radius: 22%; border: 3px solid rgba(10,18,48,0.8);
  background: linear-gradient(180deg, #ffc169, var(--el-orange) 62%, var(--el-orange));
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 -4px 0 #cf6a06, inset 0 3px 0 rgba(255,255,255,0.5); }
#card-chest .chest .el-icon { width: 62%; height: 62%; fill: #7a4a12; }
#card-chest .ready { color: var(--el-success); font-weight: 900; font-size: 17px; }

/* ---------- défi du jour (bas gauche) : x30, bas 30 ---------- */
#daily-card { position: absolute; left: calc(30px - var(--edge-x, 0px)); bottom: 30px; height: 132px; width: 560px;
  display: flex; align-items: center; gap: 16px; padding: 0 22px;
  background: linear-gradient(180deg, #2f74e0, #1d55b4 62%, #1d55b4);
  border: 4px solid rgba(10,18,48,0.9); border-radius: 22px; cursor: pointer;
  box-shadow: inset 0 -6px 0 #123a80, inset 0 3px 0 rgba(255,255,255,0.3), 0 6px 14px rgba(10,18,48,0.4); }
#daily-card .gems { flex: 0 0 auto; width: 74px; height: 74px;
  display: flex; align-items: center; justify-content: center; }
#daily-card .gems .el-icon { width: 100%; height: 100%; fill: #4fc7f0;
  filter: drop-shadow(0 4px 0 rgba(10,18,48,0.45)) drop-shadow(0 0 8px rgba(79,199,240,0.6)); }
#daily-card .txt { display: flex; flex-direction: column; gap: 4px; }
#daily-card .t { color: var(--el-gold); font-weight: 900; font-size: 23px; letter-spacing: 0.8px; white-space: nowrap; }
#daily-card .d1 { color: #fff; font-weight: 800; font-size: 20px; white-space: nowrap; }
#daily-card .d2 { color: var(--el-text-muted); font-weight: 700; font-size: 17px; white-space: nowrap; }
#daily-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-left: auto; }
#daily-card .prog { color: #fff; font-weight: 900; font-size: 27px; }
#daily-card .reward { background: linear-gradient(180deg, #17234a, #0d1834);
  border: 3px solid rgba(10,18,48,0.9); border-radius: 999px; padding: 6px 15px;
  color: #fff; font-weight: 900; font-size: 17px; display: flex; align-items: center; gap: 6px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.15); }
#daily-card .reward .el-icon { width: 18px; height: 18px; fill: #b06ef5; }

/* ---------- bouton JOUER (bas droite) : très grand ---------- */
#play-btn { position: absolute; right: calc(30px - var(--edge-x, 0px)); bottom: 30px; width: 520px; height: 168px;
  display: flex; align-items: center; justify-content: center; gap: 20px; cursor: pointer;
  border-radius: 30px; border: 5px solid #17234a;
  background: linear-gradient(180deg, #ffe993 0%, var(--el-gold) 58%, var(--el-gold) 100%);
  outline: 3px solid rgba(10,18,48,0.5); outline-offset: 2px;
  box-shadow: inset 0 -13px 0 #e09b00, inset 0 4px 0 rgba(255,255,255,0.6),
    0 9px 20px rgba(10,18,48,0.5);
  transition: transform 0.06s, box-shadow 0.06s; }
#play-btn::after { content: ""; position: absolute; left: 7px; right: 7px; top: 5px; height: 46%;
  border-radius: 23px 23px 48% 48%;
  background: linear-gradient(180deg, rgba(255,255,255,0.58), rgba(255,255,255,0.18));
  pointer-events: none; }
#play-btn:hover { filter: brightness(1.04); }
#play-btn:active { transform: translateY(5px); box-shadow: inset 0 -7px 0 #e09b00,
  inset 0 4px 0 rgba(255,255,255,0.6), 0 3px 8px rgba(10,18,48,0.5); }
#play-btn .tri { width: 58px; height: 58px; position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center; }
#play-btn .tri .el-icon { width: 100%; height: 100%; fill: #fff;
  filter: drop-shadow(0 3px 0 rgba(23,35,74,0.6)); }
#play-btn .lbl { color: #fff; font-weight: 900; font-size: 64px; letter-spacing: 2px;
  position: relative; z-index: 1;
  -webkit-text-stroke: 2.5px rgba(23,35,74,0.8); paint-order: stroke fill;
  text-shadow: 0 4px 0 rgba(23,35,74,0.5); }

/* ---------- toast (pas d'emoji, spec §18) ---------- */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 10; background: rgba(10,18,48,0.95); border: 3px solid var(--el-gold);
  border-radius: 999px; color: var(--el-cream); font-weight: 900; font-size: 16px;
  padding: 10px 22px; display: none; }
#toast.show { display: block; }

/* ---------- rotation requise (icône CSS, pas d'emoji) ---------- */
#rotate-prompt { display: none; position: fixed; inset: 0; z-index: 90; background: var(--el-bg-deep);
  color: var(--el-text-main); flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 16px; font-weight: 800; font-size: 18px; }
#rotate-prompt .phone { width: 46px; height: 80px; border: 4px solid var(--el-gold);
  border-radius: 10px; animation: rotHint 1.6s ease-in-out infinite alternate; }
@keyframes rotHint { from { transform: rotate(0); } to { transform: rotate(90deg); } }
@media (orientation: portrait) { #rotate-prompt { display: flex; } }
</style>
</head>
<body>
<canvas id="world-bg"></canvas>

<div id="stage">
  <img id="hero" src="ui/hero-max.png" alt="Max et son compagnon" />

  <!-- carte joueur -->
  <div id="player-card">
    <div class="avatar">
      <div class="face"></div>
      <div class="hair"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="lvl-badge">+</div>
    </div>
    <div class="who">
      <span class="name">MAX</span>
      <span class="lvl"><svg class="el-icon"><use href="#icon-star"></use></svg>Niveau 17</span>
      <div class="xp-track"><div class="xp-fill"></div><span class="xp-num">1250/2000</span></div>
    </div>
  </div>
  <div id="xp-chip" data-soon>XP</div>

  <!-- monnaies + menu -->
  <div id="top-right">
    <div class="capsule" id="coin-capsule">
      <svg class="el-icon"><use href="#icon-coin"></use></svg>
      <span class="val">12 450</span>
      <div class="add" data-soon><svg class="el-icon"><use href="#icon-plus"></use></svg></div>
    </div>
    <div class="capsule" id="gem-capsule">
      <svg class="el-icon"><use href="#icon-gem"></use></svg>
      <span class="val">480</span>
      <div class="add" data-soon><svg class="el-icon"><use href="#icon-plus"></use></svg></div>
    </div>
    <div id="burger" data-soon>
      <svg class="el-icon"><use href="#icon-menu"></use></svg>
      <span class="badge">3</span>
    </div>
  </div>

  <!-- navigation -->
  <div id="side-nav">
    <div class="nav-btn plate-orange" data-href="./personnages.html">
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-avatar"></use></svg></span>
      <span class="lbl">PERSONNAGE</span>
      <span class="badge">!</span>
    </div>
    <div class="nav-btn plate-cyan" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-paw"></use></svg></span>
      <span class="lbl">PETS</span>
      <span class="badge badge-green">5</span>
    </div>
    <div class="nav-btn plate-purple" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-gift"></use></svg></span>
      <span class="lbl">RÉCOMPENSES</span>
      <span class="badge">2</span>
    </div>
    <div class="nav-btn plate-blue" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-book"></use></svg></span>
      <span class="lbl">QUÊTES</span>
    </div>
    <div class="nav-btn plate-navy" data-soon>
      <span class="nav-ico"><svg class="el-icon"><use href="#icon-addPerson"></use></svg></span>
      <span class="lbl">SOCIAL</span>
    </div>
  </div>

  <!-- colonne droite -->
  <div id="right-stack">
    <div class="event-card" id="card-event" data-soon>
      <div class="t">ÉVÉNEMENT</div>
      <div class="sub"><span class="pill">Fin dans : <b id="event-timer">1h 24min</b></span></div>
    </div>
    <div class="event-card" id="card-xp" data-soon>
      <div class="hex"><span>2x</span></div>
      <div class="txt">
        <div class="t">DOUBLE XP</div>
        <div class="pct">+100%</div>
      </div>
    </div>
    <div class="event-card" id="card-chest" data-soon>
      <div class="chest"><svg class="el-icon"><use href="#icon-gift"></use></svg></div>
      <div class="txt">
        <div class="t">COFFRE GRATUIT</div>
        <div class="ready">Prêt !</div>
      </div>
      <span class="badge">!</span>
    </div>
  </div>

  <!-- défi du jour -->
  <div id="daily-card" data-href="./spike3d-arena.html">
    <div class="gems"><svg class="el-icon"><use href="#icon-gem"></use></svg></div>
    <div class="txt">
      <div class="t">DÉFI DU JOUR</div>
      <div class="d1">Fractions · CM1-CM2</div>
      <div class="d2">Termine 3 parties</div>
    </div>
    <div class="right">
      <span class="prog">2/3</span>
      <span class="reward">+50 <svg class="el-icon"><use href="#icon-star"></use></svg></span>
    </div>
  </div>

  <!-- JOUER -->
  <div id="play-btn" data-href="./spike3d-arena.html">
    <span class="tri"><svg class="el-icon"><use href="#icon-play"></use></svg></span>
    <span class="lbl">JOUER</span>
  </div>
</div>

<div id="toast">Bientôt disponible !</div>
<div id="rotate-prompt">
  <div class="phone"></div>
  <div>Tourne ton téléphone en mode paysage&nbsp;!</div>
</div>

<script src="ui/icons.js"></script>
<script>
// ---------- scale uniforme de la scène 1536×864 (spec §14) ----------
{
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1536, innerHeight / 864);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
    // écrans plus allongés que 16:9 (iPhone) : les colonnes gauche/droite
    // s'ancrent aux VRAIS bords de l'écran au lieu du cadre 16:9 centré
    // (retour Camille 2026-08-12 : « trop au centre ») — safe areas incluses
    const sl = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sal')) || 0;
    const extra = Math.max(0, (innerWidth / s - 1536) / 2 - sl / s);
    stage.style.setProperty('--edge-x', `${extra}px`);
  };
  fit();
  addEventListener('resize', fit);
}

// navigation + placeholders
document.querySelectorAll('[data-href]').forEach(el =>
  el.addEventListener('click', () => { location.href = el.dataset.href; }));
let toastTimer = 0;
document.querySelectorAll('[data-soon]').forEach(el =>
  el.addEventListener('click', e => {
    e.stopPropagation();
    const t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }));
// compte à rebours de l'événement (purement visuel, 1h24 au chargement)
{
  let secs = (1 * 60 + 24) * 60;
  const el = document.getElementById('event-timer');
  setInterval(() => {
    secs = Math.max(0, secs - 1);
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    el.textContent = h > 0 ? `${h}h ${String(m).padStart(2, '0')}min` : `${m}min ${String(secs % 60).padStart(2, '0')}s`;
  }, 1000);
}

// ---------- fond peint : monde coloré (couvre tout le viewport) ----------
{
  const c = document.getElementById('world-bg');
  const paint = () => {
    const w = c.width = innerWidth * Math.min(devicePixelRatio, 2);
    const h = c.height = innerHeight * Math.min(devicePixelRatio, 2);
    const x = f => f * w, y = f => f * h;
    const ctx = c.getContext('2d');
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#3f9df8'); sky.addColorStop(0.45, '#6db9ff'); sky.addColorStop(0.75, '#a8d8ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    const sun = ctx.createRadialGradient(x(0.72), y(0.16), 0, x(0.72), y(0.16), Math.min(w, h) * 0.3);
    sun.addColorStop(0, 'rgba(255,240,190,0.8)'); sun.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = sun; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const cloud = (cx, cy, s) => {
      [[0, 0, 1], [-1.1, 0.18, 0.7], [1.1, 0.2, 0.75], [0.4, -0.4, 0.6], [-0.5, -0.35, 0.55]].forEach(([dx, dy, r]) => {
        ctx.beginPath(); ctx.arc(x(cx) + dx * s, y(cy) + dy * s, r * s, 0, Math.PI * 2); ctx.fill();
      });
    };
    cloud(0.15, 0.14, w * 0.030); cloud(0.55, 0.09, w * 0.023); cloud(0.87, 0.24, w * 0.026);
    ctx.fillStyle = 'rgba(138,85,245,0.42)';
    const tower = (cx, base, tw2, th2) => {
      ctx.fillRect(x(cx) - tw2 / 2, y(base) - th2, tw2, th2);
      ctx.beginPath(); ctx.moveTo(x(cx) - tw2 * 0.72, y(base) - th2);
      ctx.lineTo(x(cx), y(base) - th2 - tw2 * 0.9); ctx.lineTo(x(cx) + tw2 * 0.72, y(base) - th2);
      ctx.closePath(); ctx.fill();
    };
    tower(0.09, 0.62, w * 0.045, h * 0.20); tower(0.2, 0.63, w * 0.03, h * 0.13);
    tower(0.86, 0.60, w * 0.05, h * 0.24); tower(0.95, 0.62, w * 0.03, h * 0.12);
    ctx.fillStyle = 'rgba(111,216,255,0.5)';
    const crystal = (cx, base, s) => {
      ctx.beginPath(); ctx.moveTo(x(cx), y(base) - s * 2.6);
      ctx.lineTo(x(cx) + s, y(base)); ctx.lineTo(x(cx) - s, y(base)); ctx.closePath(); ctx.fill();
    };
    crystal(0.3, 0.62, w * 0.012); crystal(0.75, 0.6, w * 0.016); crystal(0.68, 0.63, w * 0.009);
    const hill = (cy, col) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, h);
      for (let i = 0; i <= 24; i++) {
        const px = i / 24 * w;
        ctx.lineTo(px, y(cy) + Math.sin(i * 0.9) * h * 0.03);
      }
      ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
    };
    hill(0.66, '#8a55f5'); hill(0.74, '#6a34d6'); hill(0.84, '#53386e');
    for (let i = 0; i < 40; i++) {
      const fx = Math.random() * w, fy = y(0.7 + Math.random() * 0.28);
      ctx.fillStyle = ['#ef4e9b', '#ffc928', '#20cff3'][i % 3] + 'aa';
      ctx.beginPath(); ctx.arc(fx, fy, w * 0.0035, 0, Math.PI * 2); ctx.fill();
    }
    const vig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.4, w / 2, h / 2, Math.max(w, h) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(14,22,56,0.5)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, w, h);
  };
  paint();
  addEventListener('resize', paint);
}
</script>
</body>
</html>

# GÉNÉRATION D'ASSETS 3D (Meshy) — le maillon « production » de la
# chaîne graphique d'Illuminia.
#
# POURQUOI un workflow plutôt qu'un appel direct : la clé d'API vit dans
# les secrets du dépôt, qui sont EN ÉCRITURE SEULE — leur valeur n'est
# lisible que par un runner Actions, pendant l'exécution. Le runner
# appelle Meshy, télécharge le .glb et le commite ; la clé ne quitte
# jamais GitHub et n'apparaît dans aucun log (masquage automatique).
#
# Lancement : onglet Actions → « Générer un asset 3D » → Run workflow.
name: Générer un asset 3D (Meshy)

on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Nom du fichier produit (sans .glb)"
        required: true
        default: "maison_aventuriers"
      prompt:
        description: "Description de l'asset (le style Illuminia est ajouté automatiquement)"
        required: false
        default: ""
      image:
        description: "Chemin d'une image de référence DANS le dépôt (image-to-3D, plus fidèle)"
        required: false
        default: ""
      texturer:
        description: "Texturer le modèle (coûte davantage de crédits)"
        type: boolean
        default: true
      branche:
        description: "Branche où déposer l'asset"
        required: true
        default: "claude/assets-meshy"

# Le job écrit dans le dépôt : il lui faut le droit d'écriture.
permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Garde-fou explicite : sans clé, on échoue avec un message clair
      # plutôt qu'avec une erreur d'authentification obscure.
      - name: Vérifier la clé d'API
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          if [ -z "$MESHY_API_KEY" ]; then
            echo "::error::Le secret MESHY_API_KEY est absent de ce dépôt."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Clé présente (${#MESHY_API_KEY} caractères)."

      - name: Générer le modèle
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          ARGS=(--nom "${{ inputs.nom }}")
          [ -n "${{ inputs.prompt }}" ] && ARGS+=(--prompt "${{ inputs.prompt }}")
          [ -n "${{ inputs.image }}" ] && ARGS+=(--image "${{ inputs.image }}")
          [ "${{ inputs.texturer }}" = "false" ] && ARGS+=(--sans-texture)
          python3 outils/artkit/meshy.py "${ARGS[@]}"

      - name: Inspecter le modèle produit
        run: |
          pip install --quiet trimesh numpy
          python3 - <<'PY'
          import trimesh, glob
          for f in glob.glob("godot/assets/artkit/genere/*.glb"):
              s = trimesh.load(f)
              b = s.bounds
              tris = sum(len(g.faces) for g in s.geometry.values())
              print("%s : %d triangles, %d matériaux" % (f, tris, len(s.geometry)))
              print("  dimensions %.2f × %.2f × %.2f" % tuple(b[1] - b[0]))
          PY

      - name: Déposer l'asset sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ inputs.branche }}"
          git add godot/assets/artkit/genere/
          git commit -m "Asset 3D généré : ${{ inputs.nom }}" || {
            echo "::warning::Aucun changement à commiter."; exit 0; }
          git push -u origin "${{ inputs.branche }}" --force-with-lease

      - uses: actions/upload-artifact@v4
        with:
          name: asset-3d-${{ inputs.nom }}
          path: godot/assets/artkit/genere/
          retention-days: 14

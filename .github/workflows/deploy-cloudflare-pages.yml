# Déploiement automatique sur Cloudflare Pages (compatible dépôt privé).
# À chaque push sur main, le site statique (index.html + public/*) est publié
# sur https://iluminia-game.pages.dev — testable depuis n'importe quel appareil.
#
# Prérequis (une seule fois) : ajouter un secret au dépôt
# (Settings → Secrets and variables → Actions → New repository secret) :
#   - CLOUDFLARE_API_TOKEN : token API avec la permission "Cloudflare Pages — Edit"
# L'Account ID n'est pas sensible, il est défini en clair ci-dessous.
name: Deploy to Cloudflare Pages

# Test ciblé (2026-08-11) : Netlify a épuisé son quota — on re-tente
# Cloudflare (compte suspendu le 09/08, peut-être levé depuis). Ne se
# déclenche QUE sur modification du marqueur .cloudflare-test (le
# dispatch manuel est refusé au bot GitHub).
on:
  push:
    branches: [main]
    paths: ['.cloudflare-test']
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7322073f8200a19e1759e152d6e2e390"
    steps:
      - name: Vérifier les secrets Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant. Ajoutez-le dans Settings → Secrets and variables → Actions, puis relancez le workflow."
            exit 1
          fi

      # Extrait le token du secret même si du texte, des guillemets ou des espaces
      # ont été collés avec, et affiche un diagnostic non sensible.
      - name: Nettoyer le token
        run: |
          CANDIDATE=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -1 || true)
          echo "Diagnostic : secret brut ${#CLOUDFLARE_API_TOKEN} caractères ; token extrait ${#CANDIDATE} caractères ; préfixe '$(printf '%s' "$CANDIDATE" | cut -c1-4)…'"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::Le secret CLOUDFLARE_API_TOKEN ne contient aucun token reconnaissable. Recréez le secret en collant uniquement le token."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$CANDIDATE" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Reproduit ce que sert Vite en dev : public/* à la racine, plus l'index.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r public/. _site/

      # Idempotent : échoue silencieusement si le projet existe déjà.
      - name: Créer le projet Pages si nécessaire
        run: npx --yes wrangler@4 pages project create iluminia-game --production-branch=main || true

      - name: Déployer
        run: npx --yes wrangler@4 pages deploy _site --project-name=iluminia-game --branch=main

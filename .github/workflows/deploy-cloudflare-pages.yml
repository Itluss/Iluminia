# Déploiement automatique sur Cloudflare Pages (compatible dépôt privé).
# À chaque push sur main, le site statique (index.html + public/*) est publié
# sur https://iluminia.pages.dev — testable depuis n'importe quel appareil.
#
# Prérequis (une seule fois) : ajouter deux secrets au dépôt
# (Settings → Secrets and variables → Actions → New repository secret) :
#   - CLOUDFLARE_API_TOKEN  : token API avec la permission "Cloudflare Pages — Edit"
#   - CLOUDFLARE_ACCOUNT_ID : identifiant du compte (dash.cloudflare.com → barre latérale)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier les secrets Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID manquants. Ajoutez-les dans Settings → Secrets and variables → Actions, puis relancez le workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Reproduit ce que sert Vite en dev : public/* à la racine, plus l'index.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r public/. _site/

      # Idempotent : échoue silencieusement si le projet existe déjà.
      - name: Créer le projet Pages si nécessaire
        run: npx --yes wrangler@4 pages project create iluminia --production-branch=main || true

      - name: Déployer
        run: npx --yes wrangler@4 pages deploy _site --project-name=iluminia --branch=main

# Déploiement GitHub Pages (2026-08-11) — le dépôt est passé public :
# hébergement gratuit et sans quota, plus aucun compte externe (Netlify à
# court de crédits, Cloudflare suspendu). À chaque push sur main, le site
# statique (index.html + public/*) est publié sur
# https://itluss.github.io/iluminia/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Reproduit ce que sert Vite en dev : public/* à la racine, plus l'index.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r public/. _site/

      # enablement: true — active Pages automatiquement au premier passage,
      # aucune manipulation dans Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

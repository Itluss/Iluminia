# Déploiement GitHub Pages (2026-08-11) — le dépôt est passé public :
# hébergement gratuit et sans quota, plus aucun compte externe (Netlify à
# court de crédits, Cloudflare suspendu). À chaque push sur main, le site
# statique (index.html + public/*) est publié sur
# https://itluss.github.io/iluminia/
#
# 2026-08-13 — conversion Godot (demande de Camille) : un job exporte la
# région « Terres d'Émeraude » (godot/) en HTML5 via Godot 4.3 headless
# (image barichello/godot-ci, threads désactivés → pas besoin de COOP/COEP
# sur Pages) et le jeu est publié sous /godot/ à côté des spikes Three.js :
# https://itluss.github.io/Iluminia/godot/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  export-godot:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      # Les templates d'export vivent dans /root dans l'image ; le job
      # tourne avec HOME=/github/home, on les copie au bon endroit.
      - name: Installer les export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      # LES TESTS MÉTIER SONT JUGES : s'ils échouent, rien n'est exporté ni
      # déployé. La suite tourne en MainLoop (pas de code de sortie côté
      # Godot) : le step échoue si le bilan « ÉCHECS : 0 » est absent de la
      # sortie, ou si un « ÉCHEC — » apparaît.
      - name: Tests métier (simulation, besoins, économie, idempotence)
        run: |
          godot --headless --path godot --import || true
          godot --headless --path godot --script res://scripts/test_simulation.gd 2>&1 | tee /tmp/tests.log
          grep -q "ÉCHECS : 0" /tmp/tests.log || { echo "::error::Tests métier en échec"; exit 1; }
          ! grep -q "^ÉCHEC — " /tmp/tests.log || { echo "::error::Au moins un test a échoué"; exit 1; }

      - name: Export Web (Godot headless)
        run: |
          mkdir -p godot/build/web
          godot --headless --path godot --export-release "Web" "$PWD/godot/build/web/index.html"
          ls -lh godot/build/web

      - uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: godot/build/web
          retention-days: 3

  deploy:
    needs: export-godot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Reproduit ce que sert Vite en dev : public/* à la racine, plus l'index.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r public/. _site/

      # Le jeu Godot exporté est servi sous /godot/.
      - name: Ajouter le jeu Godot
        uses: actions/download-artifact@v4
        with:
          name: godot-web
          path: _site/godot

      # enablement: true — active Pages automatiquement au premier passage,
      # aucune manipulation dans Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

  # Preuve de mise en ligne : le run n'est vert que si les URL répondent 200
  # (le jeu Godot ET une page spike Three.js — garde anti-régression).
  verifier:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que le site répond (HTTP 200)
        run: |
          sleep 15
          for url in \
            "https://itluss.github.io/Iluminia/godot/" \
            "https://itluss.github.io/Iluminia/godot/index.wasm" \
            "https://itluss.github.io/Iluminia/godot/index.pck" \
            "https://itluss.github.io/Iluminia/spike3d-village.html"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
            echo "HTTP $code — $url"
            [ "$code" = "200" ] || exit 1
          done

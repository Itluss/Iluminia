<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Illuminia — Home v12</title>
<link rel="stylesheet" href="reference.css" />
</head>
<body>

<div class="lobby">

  <div class="top-left">
    <div class="avatar"></div>
    <div class="profile-info">
      <div class="name-row">
        <span class="player-name">Joueur</span>
        <span class="player-level">Niv. 4</span>
      </div>
      <div class="xp-bar">
        <div class="xp-fill"></div>
      </div>
    </div>
  </div>

  <div class="top-right">
    <div class="pill coins">💰 1240</div>
    <div class="pill gems">💎 58</div>
    <div class="menu-btn">☰</div>
  </div>

  <div class="left-nav">
    <button class="nav-btn character">PERSONNAGE</button>
    <button class="nav-btn pets">PETS</button>
    <button class="nav-btn rewards">RÉCOMPENSES</button>
    <button class="nav-btn quests">QUÊTES</button>
    <button class="nav-btn social">SOCIAL</button>
  </div>

  <div class="right-cards">
    <div class="card event">ÉVÉNEMENT</div>
    <div class="card doublexp">DOUBLE XP</div>
    <div class="card chest">COFFRE GRATUIT</div>
  </div>

  <div class="bottom-left">
    <div class="daily-challenge">DÉFI DU JOUR</div>
  </div>

  <div class="bottom-right">
    <button class="play-btn">JOUER</button>
  </div>

  <div class="center-stage">
    <!-- futur personnage 3D + pet 3D -->
  </div>

</div>

</body>
</html>
